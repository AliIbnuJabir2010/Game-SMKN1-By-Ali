<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0f14" />
    <meta name="color-scheme" content="dark" />
    <title>Kuis Kelas — Prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --chalk: #1d3b66;
        --amber: #ffd98a;
        --ink: #0b0f14;
        --glass: rgba(16, 20, 26, 0.58);
        --glass-hi: rgba(26, 32, 40, 0.82);
        --line: rgba(255, 255, 255, 0.16);
        --hand:
          "Patrick Hand", "Segoe Print", "Bradley Hand", "Chalkboard SE",
          "Comic Sans MS", cursive;
        --ui:
          system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial,
          sans-serif;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        overscroll-behavior: none;
        font-family: var(--ui);
        color: #fff;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
      }

      .stage {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: #0b0f14;
      }
      #world {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      /* ---------- lapisan sinematik ---------- */
      .vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 2;
        background: radial-gradient(
          ellipse at 50% 42%,
          transparent 52%,
          rgba(0, 0, 0, 0.52) 100%
        );
      }
      .dusk {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 3;
        opacity: 0;
        transition: opacity 3.5s ease;
        background: linear-gradient(
          180deg,
          rgba(255, 170, 80, 0.1),
          rgba(255, 110, 40, 0.24)
        );
      }
      .stage.dusk-on .dusk {
        opacity: 1;
      }
      .bar {
        position: absolute;
        left: 0;
        right: 0;
        height: 0;
        background: #000;
        z-index: 4;
        pointer-events: none;
        transition: height 1.1s cubic-bezier(0.6, 0, 0.2, 1);
      }
      .bar.t {
        top: 0;
      }
      .bar.b {
        bottom: 0;
      }
      .stage.cinema .bar {
        height: max(7vh, 28px);
      }
      .intro {
        position: absolute;
        inset: 0;
        background: #000;
        z-index: 9;
        pointer-events: none;
        animation: introOut 1.8s 0.15s ease forwards;
      }
      @keyframes introOut {
        to {
          opacity: 0;
        }
      }

      /* ---------- papan tulis ---------- */
      .chalk {
        font-family: var(--hand);
        font-size: 40px;
        fill: var(--chalk);
        text-anchor: middle;
        opacity: 0;
        animation: chalkIn 1s ease forwards;
      }
      .chalk.l1 {
        animation-delay: 0.9s;
      }
      .chalk.l2 {
        animation-delay: 1.7s;
      }
      .chalk.l3 {
        animation-delay: 2.5s;
      }
      @keyframes chalkIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 0.95;
        }
      }

      /* ---------- jari mengetuk meja ---------- */
      .fg {
        transform-box: fill-box;
      }
      .stage.tapping .fg {
        animation: tap 0.64s ease-in-out infinite;
      }
      .stage.tapping .fg:nth-child(2) {
        animation-delay: 0.14s;
      }
      .stage.tapping .fg:nth-child(3) {
        animation-delay: 0.28s;
      }
      .stage.tapping .fg:nth-child(4) {
        animation-delay: 0.42s;
      }
      @keyframes tap {
        0%,
        100% {
          transform: translateY(0);
        }
        45% {
          transform: translateY(7px);
        }
      }

      /* ---------- UI ---------- */
      .choices {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 5;
        padding: 56px 14px calc(16px + env(safe-area-inset-bottom));
        background: linear-gradient(
          to top,
          rgba(4, 6, 9, 0.78),
          rgba(4, 6, 9, 0.34) 55%,
          transparent
        );
        opacity: 0;
        transform: translateY(18px);
        pointer-events: none;
        transition:
          opacity 0.55s ease,
          transform 0.55s ease;
      }
      .choices.show {
        opacity: 1;
        transform: none;
        pointer-events: auto;
      }
      .row {
        display: grid;
        gap: 10px;
        max-width: 980px;
        margin: 0 auto;
      }
      @media (min-width: 760px) {
        .row {
          grid-template-columns: repeat(3, 1fr);
          gap: 14px;
        }
      }

      .choice {
        appearance: none;
        border: 1px solid var(--line);
        background: var(--glass);
        color: #f6f3ea;
        -webkit-backdrop-filter: blur(10px) saturate(1.2);
        backdrop-filter: blur(10px) saturate(1.2);
        border-radius: 14px;
        padding: 14px 16px;
        display: flex;
        align-items: center;
        gap: 14px;
        font: 600 clamp(16px, 2.3vw, 19px)/1.25 var(--ui);
        text-align: left;
        cursor: pointer;
        min-height: 56px;
        transition:
          transform 0.2s ease,
          background 0.2s ease,
          border-color 0.2s ease;
      }
      .choices.show .choice {
        animation: rise 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
      }
      .choices.show .choice:nth-child(2) {
        animation-delay: 0.09s;
      }
      .choices.show .choice:nth-child(3) {
        animation-delay: 0.18s;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
      }
      .choice .k {
        flex: none;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        border: 1.5px dashed rgba(255, 217, 138, 0.75);
        color: var(--amber);
        font: 400 20px/1 var(--hand);
      }
      .choice:hover {
        transform: translateY(-3px);
        background: var(--glass-hi);
        border-color: rgba(255, 217, 138, 0.65);
      }
      .choice:active {
        transform: scale(0.98);
      }
      .choice:focus-visible,
      .back:focus-visible {
        outline: 2px solid var(--amber);
        outline-offset: 3px;
      }

      .runscene { position:absolute; inset:0; z-index:2; display:none; overflow:hidden;
        background:linear-gradient(#bfe3f2 0,#f3e6c4 52%); }
      .runscene.on { display:block; }
      .rs-wall { position:absolute; inset:-12px -12px 44% -12px; filter:blur(4px); background-color:#e6c968;
        background-image:linear-gradient(90deg,transparent 0 58%,rgba(120,80,30,.5) 58% 66%,transparent 66%),
        linear-gradient(0deg,rgba(0,0,0,.18) 0 6%,transparent 6%);
        background-size:620px 100%,100% 100%; animation:rsWall 1.1s linear infinite; }
      .rs-floor { position:absolute; inset:56% -12px -12px -12px; filter:blur(4px); background-color:#c9a577;
        background-image:repeating-linear-gradient(90deg,rgba(60,40,20,.16) 0 3px,transparent 3px 150px),
        linear-gradient(0deg,rgba(0,0,0,.12),rgba(255,255,255,.25));
        background-size:150px 100%,100% 100%; animation:rsFloor .5s linear infinite; }
      .rs-sp { position:absolute; height:3px; width:22vmin; border-radius:3px; background:rgba(255,255,255,.85);
        right:-30vmin; filter:blur(1.5px); animation:rsSp .55s linear infinite; }
      .rs-kid, .rs-tired { position:absolute; left:50%; bottom:13%; height:58%; transform:translateX(-50%);
        transition:left 2s ease-out, opacity .35s; user-select:none; pointer-events:none; }
      .rs-kid { aspect-ratio:422/600; background-size:400% 100%; background-repeat:no-repeat;
        animation:rsRun .46s step-end infinite; }
      .rs-tired { opacity:0; height:56%; }
      @keyframes rsRun { 0% { background-position:0 0; } 25% { background-position:33.333% 0; }
        50% { background-position:66.667% 0; } 75% { background-position:100% 0; } }
      .rs-bub { position:absolute; left:calc(50% + 15vmin); top:16%; max-width:40vmin; padding:.35em .85em;
        background:#fff; color:#222; border:3px solid #222; border-radius:20px;
        font:clamp(18px,3.6vmin,32px) 'Patrick Hand','Segoe Print',cursive; opacity:0;
        transition:opacity .4s; transform:rotate(-3deg); }
      .rs-bub.on { opacity:1; }
      .rs-door { position:absolute; right:7%; bottom:13%; height:66%; aspect-ratio:.46; background:#a8642e;
        border:8px solid #4a2c16; box-shadow:inset 0 0 0 6px #b9773c; transform:translateX(120%); opacity:0;
        transition:transform 1.8s ease-out, opacity 1.2s; }
      .rs-door::before { content:""; position:absolute; left:22%; right:22%; top:12%; height:26%;
        background:linear-gradient(#fffbe3,#cfe8c0); border:5px solid #4a2c16; }
      .rs-door::after { content:"X TJKT 2"; white-space:nowrap; position:absolute; left:50%; top:-15%; transform:translateX(-50%);
        padding:.1em .6em; background:#f0c45a; color:#3a2c16; border:4px solid #4a2c16;
        font:clamp(14px,2.8vmin,26px) 'Patrick Hand',cursive; }
      .runscene.arrive .rs-door { transform:none; opacity:1; }
      .runscene.arrive .rs-kid, .runscene.arrive .rs-tired { left:34%; }
      .runscene.stop .rs-wall, .runscene.stop .rs-floor, .runscene.stop .rs-sp, .runscene.stop .rs-kid { animation-play-state:paused; }
      .runscene.stop .rs-sp { opacity:0; }
      .runscene.tired .rs-kid { opacity:0; }
      .runscene.tired .rs-tired { opacity:1; animation:rsPant 1s ease-in-out infinite alternate; }
      @keyframes rsWall { to { background-position:-620px 0,0 0; } }
      @keyframes rsFloor { to { background-position:-150px 0,0 0; } }
      @keyframes rsSp { to { transform:translateX(-170vmax); } }
      @keyframes rsBob { to { transform:translateX(-50%) translateY(-2.2vmin) rotate(-1.5deg); } }
      @keyframes rsPant { to { transform:translateX(-50%) translateY(.8vmin) scaleY(.985); } }
      .landscene { position:absolute; inset:0; z-index:2; display:none; overflow:hidden; background:#1c2a1c; }
      .landscene.on { display:block; }
      .ls-bg { position:absolute; inset:-6%; background-size:cover; background-position:center; filter:blur(14px) brightness(.75); }
      .ls-frame { position:absolute; left:50%; top:50%; height:min(100%,133.3vw); aspect-ratio:387/516; transform:translate(-50%,-50%); }
      .ls-photo { width:100%; height:100%; display:block; }
      .ls-kid { position:absolute; left:15%; bottom:27%; width:40%; height:auto; transform-origin:50% 100%;
        filter:drop-shadow(0 .6vmin .5vmin rgba(0,0,0,.35)); animation:lsLand .55s cubic-bezier(.2,.8,.3,1) both; }
      @keyframes lsLand { 0% { transform:translateY(-45%) scaleY(1.1); opacity:0; } 30% { opacity:1; }
        62% { transform:translateY(0) scaleY(.88); } 82% { transform:scaleY(1.04); } 100% { transform:none; } }
      .climbscene { position:absolute; inset:0; z-index:2; display:none; overflow:hidden; background:#4a86d8; }
      .climbscene.on { display:block; }
      .cs-shake { position:absolute; inset:0; animation:csShake .14s linear infinite; }
      .cs-svg { position:absolute; inset:0; width:100%; height:100%; transform-origin:50% 45%;
        animation:csZoom 4.2s ease-in forwards; }
      .cs-f2 { opacity:0; }
      .climbscene.top .cs-f1 { opacity:0; }
      .climbscene.top .cs-f2 { opacity:1; }
      .cs-sp { animation:csSp .3s step-end infinite; }
      @keyframes csF1 { 0% { opacity:1; } 50% { opacity:0; } }
      @keyframes csF2 { 0% { opacity:0; } 50% { opacity:1; } }
      @keyframes csSp { 0% { opacity:1; } 50% { opacity:.25; } }
      @keyframes csZoom { to { transform:scale(1.16); } }
      @keyframes csShake { 0% { transform:translate(0,0); } 25% { transform:translate(2px,-2px); }
        50% { transform:translate(-2px,1px); } 75% { transform:translate(1px,2px); } 100% { transform:translate(0,0); } }
      .caption {
        position: absolute;
        left: 50%;
        bottom: calc(max(7vh, 28px) + 76px + env(safe-area-inset-bottom));
        z-index: 5;
        transform: translate(-50%, 10px);
        opacity: 0;
        pointer-events: none;
        max-width: 88vw;
        text-align: center;
        padding: 10px 20px;
        border-radius: 26px;
        background: rgba(10, 12, 16, 0.56);
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        border: 1px solid var(--line);
        font: 400 clamp(19px, 3.2vw, 26px)/1.25 var(--hand);
        letter-spacing: 0.3px;
        color: #fff;
        transition:
          opacity 0.8s ease,
          transform 0.8s ease;
      }
      .caption.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      .back {
        position: absolute;
        left: 50%;
        bottom: calc(max(7vh, 28px) + 14px + env(safe-area-inset-bottom));
        z-index: 5;
        transform: translate(-50%, 10px);
        opacity: 0;
        pointer-events: none;
        appearance: none;
        border: 1px solid var(--line);
        background: var(--glass);
        color: #f6f3ea;
        cursor: pointer;
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        border-radius: 999px;
        padding: 12px 22px;
        min-height: 48px;
        font: 600 15px/1 var(--ui);
        transition:
          opacity 0.6s ease,
          transform 0.6s ease,
          background 0.2s ease,
          border-color 0.2s ease;
      }
      .back.show {
        opacity: 1;
        transform: translate(-50%, 0);
        pointer-events: auto;
      }
      .back:hover {
        background: var(--glass-hi);
        border-color: rgba(255, 217, 138, 0.65);
      }

      /* ---------- adegan gerbang (datar, dua warna) ---------- */
      #gate {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: none;
      }
      .stage.in-gate #gate {
        display: block;
      }
      .stage.in-gate #world {
        display: none;
      }
      .stage.in-gate .vignette {
        opacity: 0;
      }
      .choices.flat {
        background: none;
      }
      .askwrap {
        text-align: center;
        margin: 0 auto 14px;
      }
      .ask {
        display: inline-block;
        max-width: 92vw;
        padding: 9px 22px;
        border-radius: 999px;
        background: rgba(10, 12, 16, 0.74);
        border: 1px solid var(--line);
        font: 400 clamp(22px, 3.6vw, 30px)/1.25 var(--hand);
        color: #fff;
      }
      .fade {
        position: absolute;
        inset: 0;
        background: #000;
        z-index: 8;
        opacity: 0;
        pointer-events: none;
        transition: opacity 1s ease;
      }
      .fade.on {
        opacity: 1;
      }
      .card {
        position: absolute;
        inset: 0;
        z-index: 9;
        display: grid;
        place-content: center;
        text-align: center;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.9s ease;
        padding: 0 8vw;
        font: 400 clamp(28px, 5.4vw, 48px)/1.3 var(--hand);
        color: var(--amber);
      }
      .card.show {
        opacity: 1;
      }
      .card small {
        display: block;
        margin-top: 12px;
        font: 400 clamp(18px, 3vw, 26px)/1.35 var(--hand);
        color: #f3f5ec;
        opacity: 0.85;
      }

      /* ---------- kartu karakter dari Bu Guru ---------- */
      .reveal {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        padding: 14px;
        background: rgba(6, 8, 12, 0.62);
        opacity: 0;
        pointer-events: none;
        perspective: 1600px;
        transition: opacity 0.8s ease;
      }
      .reveal.show {
        opacity: 1;
        pointer-events: auto;
      }
      .flip {
        display: grid;
        width: min(94vw, 520px);
        transform-style: preserve-3d;
        transition: transform 1.3s cubic-bezier(0.3, 0.7, 0.2, 1);
      }
      .reveal.flipped .flip {
        transform: rotateY(180deg);
      }
      .face {
        grid-area: 1/1;
        border-radius: 22px;
        background: #f6efdc;
        color: #1f2d3d;
        border: 4px solid #1f2d3d;
        box-shadow:
          0 0 0 6px #f2b04c,
          0 26px 64px rgba(0, 0, 0, 0.55);
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
      }
      .face.front {
        display: grid;
        place-content: center;
        gap: 6px;
        text-align: center;
        min-height: 300px;
      }
      .face.front span {
        font: 400 clamp(120px, 32vw, 200px)/1 var(--hand);
        color: #f2b04c;
        text-shadow: 0 4px 0 #1f2d3d;
      }
      .face.front small {
        font: 400 clamp(20px, 4vw, 26px)/1.2 var(--hand);
      }
      .face.rear {
        transform: rotateY(180deg);
      }
      .scroll {
        max-height: min(82vh, 700px);
        overflow-y: auto;
        padding: 22px 22px 24px;
        touch-action: pan-y;
        overscroll-behavior: contain;
      }
      .kicker {
        font: 600 12px/1 var(--ui);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #8a6a2c;
      }
      .face h2 {
        margin: 8px 0 2px;
        font: 400 clamp(32px, 7.4vw, 46px)/1.1 var(--hand);
        color: #1f2d3d;
      }
      .face .sub {
        margin: 0 0 14px;
        font: 400 clamp(17px, 3.4vw, 21px)/1.3 var(--hand);
        color: #55606c;
      }
      .trait {
        display: grid;
        grid-template-columns: 150px 1fr;
        align-items: center;
        gap: 10px;
        margin: 8px 0;
        font: 400 clamp(17px, 3.4vw, 20px)/1 var(--hand);
      }
      .trait i {
        display: block;
        height: 14px;
        border-radius: 99px;
        background: rgba(31, 45, 61, 0.14);
        overflow: hidden;
      }
      .trait b {
        display: block;
        height: 100%;
        width: 0;
        border-radius: 99px;
        background: #f2b04c;
        box-shadow: inset 0 0 0 2px #1f2d3d;
        transition: width 1.1s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .note {
        margin-top: 16px;
        padding: 14px 16px;
        border: 2px dashed #1f2d3d;
        border-radius: 14px;
        background: rgba(242, 176, 76, 0.18);
      }
      .note b {
        font: 600 12px/1 var(--ui);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #8a6a2c;
      }
      .note p {
        margin: 8px 0 0;
        font: 400 clamp(19px, 3.6vw, 23px)/1.35 var(--hand);
      }
      .again2 {
        appearance: none;
        display: block;
        margin: 18px auto 0;
        border: 3px solid #1f2d3d;
        background: #f2b04c;
        color: #1f2d3d;
        border-radius: 999px;
        padding: 12px 26px;
        min-height: 48px;
        font: 600 16px/1 var(--ui);
        cursor: pointer;
        transition: transform 0.2s ease;
      }
      .again2:hover {
        transform: translateY(-2px);
      }
      .again2:focus-visible {
        outline: 2px solid #1f2d3d;
        outline-offset: 3px;
      }
      @media (prefers-reduced-motion: reduce) {
        .flip,
        .trait b,
        .reveal {
          transition-duration: 0.01s;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .stage.tapping .fg {
          animation: none;
        }
        .intro {
          animation-duration: 0.4s;
        }
      }
    </style>
  </head>
  <body>
    <main class="stage in-gate" id="stage">
      <svg
        id="world"
        viewBox="0 0 1600 1000"
        preserveAspectRatio="xMidYMid slice"
        role="img"
        aria-label="Suasana kelas dari belakang seorang murid yang menghadap papan tulis"
      >
        <defs>
          <linearGradient id="ceilG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#bdb6a1" />
            <stop offset="1" stop-color="#d8d1bd" />
          </linearGradient>
          <linearGradient id="coveG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#000" stop-opacity=".22" />
            <stop offset="1" stop-color="#000" stop-opacity="0" />
          </linearGradient>
          <linearGradient id="wallG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f1e9d3" />
            <stop offset="1" stop-color="#e2d9be" />
          </linearGradient>
          <linearGradient id="dadoG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#a8c1ae" />
            <stop offset="1" stop-color="#8fab98" />
          </linearGradient>
          <linearGradient id="floorG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#d2cab7" />
            <stop offset="1" stop-color="#9b9380" />
          </linearGradient>
          <linearGradient id="floorShade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#000" stop-opacity="0" />
            <stop offset="1" stop-color="#000" stop-opacity=".35" />
          </linearGradient>
          <linearGradient id="boardG" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#fcfcf9" />
            <stop offset="1" stop-color="#e4e6e1" />
          </linearGradient>
          <linearGradient id="deskG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#dcba88" />

    </main>

    <script>
      (() => {
        "use strict";
        const $ = (id) => document.getElementById(id);
        const svg = $("world"),
          gsvg = $("gate"),
          stage = $("stage");
        const lerp = (a, b, t) => a + (b - a) * t;
        const easeIO = (t) =>
          t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        const easeO = (t) => 1 - Math.pow(1 - t, 3);
        const lin = (t) => t;
        const reduce =
          window.matchMedia &&
          matchMedia("(prefers-reduced-motion: reduce)").matches;

        /* ---------- kamera ---------- */
        // w,h = area minimum yang harus terlihat; sisanya mengikuti rasio layar
        const CAM = {
          intro: { cx: 800, cy: 420, w: 1080, h: 930 },
          board: { cx: 800, cy: 462, w: 900, h: 780 },
          book: { cx: 915, cy: 655, w: 440, h: 280 },
          bookIn: { cx: 932, cy: 668, w: 400, h: 255 },
          clock: { cx: 1372, cy: 256, w: 400, h: 260 },
          window: { cx: 212, cy: 300, w: 440, h: 340 },
          windowIn: { cx: 222, cy: 300, w: 380, h: 293 },
          deliver: { cx: 800, cy: 610, w: 760, h: 560 },
          gateWide: { cx: 800, cy: 600, w: 1500, h: 800 },
          gateMid: { cx: 800, cy: 610, w: 1180, h: 700 },
          gateAsk: { cx: 800, cy: 735, w: 1180, h: 700 },
          gateTell: { cx: 790, cy: 610, w: 980, h: 640 },
          gateClimb: { cx: 1010, cy: 575, w: 1240, h: 720 },
          gateBack: { cx: 1440, cy: 620, w: 1000, h: 640 },
          paper: { cx: 930, cy: 676, w: 430, h: 290 },
          friend: { cx: 1450, cy: 650, w: 300, h: 200 },
          corridor: { cx: 500, cy: 560, w: 1100, h: 640 },
          wallet: { cx: 1390, cy: 755, w: 760, h: 480 },
          room: { cx: 800, cy: 650, w: 1300, h: 760 },
          deskCard: { cx: 810, cy: 600, w: 600, h: 380 },
        };
        const cam = { ...CAM.intro };
        let par = 0; // 0 = di belakang murid, 1 = melewati bahu menuju meja
        let aspect = 1.6,
          token = 0,
          state = "intro";

        function measure() {
          const r = stage.getBoundingClientRect();
          aspect = Math.max(0.2, r.width / Math.max(1, r.height));
        }
        addEventListener("resize", measure);
        measure();

        function renderCam(t) {
          const visW = Math.max(cam.w, cam.h * aspect),
            visH = visW / aspect,
            k = visW / 1000;
          const sx = reduce ? 0 : Math.sin(t * 0.55) * 4 * k,
            sy = reduce ? 0 : Math.cos(t * 0.43) * 3 * k;
          (stage.classList.contains("in-gate") ? gsvg : svg).setAttribute(
            "viewBox",
            `${cam.cx + sx - visW / 2} ${cam.cy + sy - visH / 2} ${visW} ${visH}`,
          );
        }

        /* ---------- tween & waktu ---------- */
        function tween(dur, fn, ease = easeIO) {
          const my = token;
          return new Promise((res) => {
            const t0 = performance.now();
            (function step() {
              if (my !== token) {
                res(false);
                return;
              }
              const k = Math.min(1, (performance.now() - t0) / (dur * 1000));
              fn(ease(k), k);
              if (k < 1) requestAnimationFrame(step);
              else res(true);
            })();
          });
        }
        function wait(s) {
          const my = token;
          return new Promise((r) =>
            setTimeout(() => r(my === token), s * 1000),
          );
        }

        let camJob = 0;
        function camTo(target, parTarget, dur, ease = easeIO) {
          const c0 = { ...cam },
            p0 = par,
            job = ++camJob;
          return tween(
            dur,
            (e) => {
              if (job !== camJob) return;
              cam.cx = lerp(c0.cx, target.cx, e);
              cam.cy = lerp(c0.cy, target.cy, e);
              cam.w = c0.w * Math.pow(target.w / c0.w, e);
              cam.h = c0.h * Math.pow(target.h / c0.h, e);
              par = lerp(p0, parTarget, e);
              renderParallax();
            },
            ease,
          );
        }

        /* ---------- jam dinding ---------- */
        const clock = { sec: 0, f: 1 };
        const hHand = $("hHand"),
          mHand = $("mHand"),
          sHand = $("sHand");
        (function ticks() {
          let s = "";
          for (let i = 0; i < 12; i++) {
            s += `<line x1="1372" y1="196" x2="1372" y2="${i % 3 === 0 ? 206 : 203}" transform="rotate(${i * 30} 1372 256)"/>`;
          }
          $("ticks").innerHTML = s;
        })();
        function renderClock() {
          const s = clock.sec % 60,
            mins = 50 + clock.sec / 60;
          sHand.setAttribute("transform", `rotate(${s * 6} 1372 256)`);
          mHand.setAttribute(
            "transform",
            `rotate(${(mins * 6) % 360} 1372 256)`,
          );
          hHand.setAttribute(
            "transform",
            `rotate(${((1 + mins / 60) % 12) * 30} 1372 256)`,
          );
        }

        /* ---------- lantai ---------- */
        (function floor() {
          let s = "";
          for (let k = -14; k <= 14; k++) {
            const x0 = 800 + k * 130,
              x1 = 800 + ((x0 - 800) * (2200 - 300)) / (720 - 300);
            s += `<line x1="${x0}" y1="720" x2="${x1.toFixed(0)}" y2="2200"/>`;
          }
          for (
            let n = 0, y = 740;
            y < 2200;
            n++, y = 720 + 34 * Math.pow(1.32, n)
          ) {
            s += `<line x1="-400" y1="${y.toFixed(0)}" x2="2000" y2="${y.toFixed(0)}"/>`;
          }
          $("floorLines").innerHTML = s;
        })();

        /* ---------- tulisan tangan ---------- */
        const inkG = $("ink"),
          NS = "http://www.w3.org/2000/svg";
        const INK_FONT =
          "'Patrick Hand','Segoe Print','Bradley Hand','Comic Sans MS',cursive";
        function makeInk(group, texts, x, ys, maxW, size, tag) {
          const lines = texts.map((str, i) => {
            const id = tag + i;
            const cp = document.createElementNS(NS, "clipPath");
            cp.setAttribute("id", id);
            const r = document.createElementNS(NS, "rect");
            r.setAttribute("x", x - 3);
            r.setAttribute("y", ys[i] - 24);
            r.setAttribute("height", 34);
            r.setAttribute("width", 0);
            cp.appendChild(r);
            svg.querySelector("defs").appendChild(cp);
            const t = document.createElementNS(NS, "text");
            t.setAttribute("x", x);
            t.setAttribute("y", ys[i]);
            t.setAttribute("font-family", INK_FONT);
            t.setAttribute("font-size", size);
            t.setAttribute("fill", "#1f3fa8");
            t.setAttribute("stroke", "none");
            t.setAttribute("clip-path", `url(#${id})`);
            t.textContent = str;
            group.appendChild(t);
            return { t, r, x, y: ys[i], w: 0 };
          });
          lines.maxW = maxW;
          lines.size = size;
          return lines;
        }
        function measureLines(lines) {
          lines.forEach((l) => {
            l.t.setAttribute("font-size", lines.size);
            let w = l.t.getComputedTextLength();
            if (w > lines.maxW) {
              l.t.setAttribute(
                "font-size",
                ((lines.size * lines.maxW) / w).toFixed(2),
              );
              w = lines.maxW;
            }
            l.w = w;
          });
        }
        const inkLines = makeInk(
          inkG,
          ["Developer by", "Ali Ibnu Jabir", "and", "Rizky Saputra", "Dinata"],
          952,
          [637, 657, 677, 697, 717],
          140,
          17,
          "inkClip",
        );
        function resetInk() {
          inkLines.forEach((l) => l.r.setAttribute("width", 0));
          inkG.removeAttribute("style");
          inkG.setAttribute("opacity", 0.92);
        }

        function extend(E, H, amt) {
          const dx = E.x - H.x,
            dy = E.y - H.y,
            l = Math.hypot(dx, dy) || 1;
          return { x: E.x + (dx / l) * amt, y: E.y + (dy / l) * amt };
        }
        function setLine(a, b, x1, y1, x2, y2) {
          [a, b].forEach((n) => {

        /* ---------- SCENE 2A: kerjakan sekarang ---------- */
        async function writing(lines = inkLines) {
          // jangkau pulpen
          const P = { x: pen.tx + pen.dx * 0.5, y: pen.ty + pen.dy * 0.5 };
          const hs = { x: R.hx, y: R.hy },
            hr = { x: P.x + 16, y: P.y + 18 };
          if (
            !(await tween(1, (e) => {
              R.hx = lerp(hs.x, hr.x, e);
              R.hy = lerp(hs.y, hr.y, e);
              R.fx = R.hx - 16;
              R.fy = R.hy - 18;
              drawArms();
            }))
          )
            return;
          if (!(await wait(0.2))) return;

          // ambil pulpen & angkat ke baris pertama
          const T0 = { x: pen.tx, y: pen.ty },
            D0 = { x: pen.dx, y: pen.dy };
          measureLines(lines);
          const T1 = { x: lines[0].x, y: lines[0].y - 2 },
            D1 = { x: 30, y: 72 };
          if (
            !(await tween(1.1, (e) => {
              pen.tx = lerp(T0.x, T1.x, e);
              pen.ty = lerp(T0.y, T1.y, e) - 20 * Math.sin(Math.PI * e);
              pen.dx = lerp(D0.x, D1.x, e);
              pen.dy = lerp(D0.y, D1.y, e);
              const k = lerp(0.5, 0.85, e),
                ox = lerp(16, 0, e),
                oy = lerp(18, 0, e),
                fk = lerp(0.5, 0.45, e);
              R.hx = pen.tx + pen.dx * k + ox;
              R.hy = pen.ty + pen.dy * k + oy;
              R.fx = pen.tx + pen.dx * fk;
              R.fy = pen.ty + pen.dy * fk;
              drawArms();
            }))
          )
            return;

          const setTip = (x, y) => {
            pen.tx = x;
            pen.ty = y;
            R.hx = x + pen.dx * 0.85;
            R.hy = y + pen.dy * 0.85;
            R.fx = x + pen.dx * 0.45;
            R.fy = y + pen.dy * 0.45;
            drawArms();
          };
          for (let i = 0; i < lines.length; i++) {
            const l = lines[i];
            if (i > 0) {
              const a = { x: pen.tx, y: pen.ty },
                b = { x: l.x, y: l.y - 2 };
              if (
                !(await tween(0.28, (e) =>
                  setTip(
                    lerp(a.x, b.x, e),
                    lerp(a.y, b.y, e) - 8 * Math.sin(Math.PI * e),
                  ),
                ))
              )
                return;
            }
            if (
              !(await tween(
                Math.max(0.6, l.w / 70),
                (e) => {
                  const x = l.x + e * l.w;
                  l.r.setAttribute("width", e * l.w + 3 + (e >= 1 ? 8 : 0));
                  setTip(x, l.y - 2 - 3 * Math.abs(Math.sin(x * 0.7)));
                },
                lin,
              ))
            )
              return;
          }
          // angkat pulpen sedikit setelah selesai
          const a = { x: pen.tx, y: pen.ty };
          return await tween(
            0.6,
            (e) => setTip(a.x + 6 * e, a.y - 10 * e),
            easeO,
          );
        }
        /* ---------- mengantar tugas ke meja guru ---------- */
        const bookWrap = $("bookWrap"),

        const BOOK_C = { x: 915, y: 680 },
          DESK_C = { x: 800, y: 528 },
          BOOK_S = 0.3;
        const HL0 = { x: H_L.x, y: H_L.y };
        let bookU = 0;
        function bookPose(u, lift) {
          return {
            s: lerp(1, BOOK_S, u),
            x: lerp(BOOK_C.x, DESK_C.x, u),
            y:
              lerp(BOOK_C.y, DESK_C.y, u) - (lift || 0) * Math.sin(Math.PI * u),
          };
        }
        const bookPt = (q, p) => ({
          x: q.x + q.s * (p.x - BOOK_C.x),
          y: q.y + q.s * (p.y - BOOK_C.y),
        });
        function setBook(u, lift) {
          bookU = u;
          if (u === 0) {
            bookWrap.removeAttribute("transform");
            return;
          }
          const q = bookPose(u, lift);
          bookWrap.setAttribute(
            "transform",
            `translate(${q.x.toFixed(1)} ${q.y.toFixed(1)}) scale(${q.s.toFixed(3)}) translate(${-BOOK_C.x} ${-BOOK_C.y})`,
          );
        }
        function setLeft(x, y) {
          H_L.x = x;
          H_L.y = y;
          handLg.setAttribute(
            "transform",
            `translate(${x - HL0.x} ${y - HL0.y})`,

        async function deliver() {
          const R1 = { ...R },
            P1 = { ...pen },
            L1 = { x: H_L.x, y: H_L.y };
          const oPen = { x: P1.tx - R1.hx, y: P1.ty - R1.hy },
            oF = { x: R1.fx - R1.hx, y: R1.fy - R1.hy };
          const rPt = { x: 1092, y: 744 },
            lPt = { x: 712, y: 736 };
          const setHands = (rx, ry, lx, ly) => {
            R.hx = rx;
            R.hy = ry;
            R.fx = rx + oF.x;
            R.fy = ry + oF.y;
            pen.tx = rx + oPen.x;
            pen.ty = ry + oPen.y;
            setLeft(lx, ly);
            drawArms();
          };
          hideCaption();
          camTo(CAM.deliver, 1, 1.8);
          // 1) tangan memegang buku
          if (
            !(await tween(0.9, (e) =>
              setHands(
                lerp(R1.hx, rPt.x, e),
                lerp(R1.hy, rPt.y, e),
                lerp(L1.x, lPt.x, e),
                lerp(L1.y, lPt.y, e),
              ),
            ))
          )
            return;
          caption("Selesai! Saatnya dikumpulkan.");
          $("studentBody").after(bookWrap); // buku tampil di atas badan murid
          if (!(await wait(0.5))) return;
          // 2) buku dibawa ke meja guru
          if (
            !(await tween(2.4, (e) => {
              setBook(e, 120);
              const q = bookPose(e, 120),
                a = bookPt(q, rPt),
                b = bookPt(q, lPt);
              setHands(a.x, a.y, b.x, b.y);
            }))
          )
            return;
          setBook(1);
          hideCaption();
          if (!(await wait(0.5))) return;
          caption("Tugas sudah dikumpulkan ke guru.");
          // 3) tangan kembali
          const Re = { ...R },
            Pe = { ...pen },
            Le = { x: H_L.x, y: H_L.y };
          return await tween(1.2, (e) => {
            R.hx = lerp(Re.hx, R0.hx, e);
            R.hy = lerp(Re.hy, R0.hy, e);
            R.fx = lerp(Re.fx, R0.fx, e);
            R.fy = lerp(Re.fy, R0.fy, e);
            ["tx", "ty", "dx", "dy"].forEach(
              (k) => (pen[k] = lerp(Pe[k], PEN0[k], e)),
            );
            setLeft(lerp(Le.x, HL0.x, e), lerp(Le.y, HL0.y, e));
            drawArms();
          });
        }

        // mix: 0 = pose mengerem, 1 = berdiri (menghadap gerbang)
        function stopShow(x, y, mix, rot) {
          const g = stopEnsure();
          kidOpacity(0);
          g.style.display = "";
          g.setAttribute("transform", `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(rot || 0).toFixed(2)})`);
          g.children[0].style.display = mix < 1 ? "" : "none";
          g.children[0].setAttribute("opacity", (1 - mix).toFixed(2));
          g.children[1].style.display = mix > 0 ? "" : "none";
          g.children[1].setAttribute("opacity", mix.toFixed(2));
        }
        function stopHide() {
          if (stopG) stopG.style.display = "none";
          kidOpacity(1);
        }

        async function gateStart() {
          state = "gate";
          stage.classList.add("in-gate", "cinema");
          Object.assign(cam, CAM.gateWide);
          par = 0;
          setLeaf(LEAF_OPEN);
          setDoor(1);
          kidOpacity(1);
          if (runG) runG.style.display = "none";
          if (stopG) stopG.style.display = "none";
          walkHide();
          $("fenceWall").after(guard.g);
          $("fenceTop").parentNode.insertBefore(kid.g, null);
          place(guard, LEAF_OPEN - 58, 694, 1, "L");
          idlePose(guard);
          place(kid, 1900, 880, 1.2, "L");
          idlePose(kid);
          if (!(await wait(1.2))) return;
          caption(
            "Bel masuk sudah berbunyi. Pak Satpam mulai menutup gerbang...",
          );
          if (!(await wait(2.6))) return;
          hideCaption();

          const closing = tween(3.8, (e) => {
            const x = lerp(LEAF_OPEN, LEAF_SHUT, e);
            setLeaf(x);
            place(guard, x - 58, 694 - Math.abs(Math.sin(e * 28)) * 3, 1, "L");
            walkPose(guard, e * 28, 22, 10);
            rotAt(guard.aa, -78);
            rotAt(guard.ab, -66);
          });
          camTo(CAM.gateMid, 0, 4.4);
          if (!(await wait(1.1))) return;
          const run = tween(
            3.1,
            (e) => {
              const x = lerp(1800, 1040, e);
              const fr = Math.floor((e * 3.1) / 0.2) % 4;
              runShow(x, 880, fr, -Math.abs(Math.sin(e * 3.1 * Math.PI * 3.2)) * 8);
            },
            lin,
          );
          const done = await Promise.all([closing, run]);
          if (done.includes(false)) return;
          if (runG) runG.style.display = "none";
          place(kid, 930, 880, 1.2, "L");
          idlePose(kid);
          // animasi berhenti: mengerem meluncur, lalu berdiri menghadap gerbang
          if (
            !(await tween(0.9, (e) => {
              const k = 1 - Math.pow(1 - e, 3);
              stopShow(lerp(1040, 930, k), 880, 0, lerp(5, 0, k));
            }, lin))
          )
            return;
          if (!(await wait(0.3))) return;
          if (
            !(await tween(0.3, (e) => stopShow(930, 880, e, 0), lin))
          )
            return;
          if (!(await wait(0.6))) return;

          place(guard, LEAF_SHUT - 58, 694, 1, "R");
          caption("Kamu terlambat...");
          camTo(CAM.gateAsk, 0, 1.6);
          if (!(await wait(1.8))) return;
          hideCaption();
          state = "gate-ask";
          gateChEl.classList.add("show");
        }

        function chooseGate(k) {
          if (state !== "gate-ask") return;
          state = "gate-scene";
          gateChEl.classList.remove("show");
          stopHide();
          ({ climb: gateClimb, tell: gateTell, back: gateBack })[k]();
        }

        /* pilihan 1: panjat pagar */
        async function gateClimb() {
          camTo(CAM.gateClimb, 0, 2.4);
          caption("Gerbang sudah terkunci... pagarnya tidak terlalu tinggi.");
          if (
            !(await tween(
              1.9,
              (e) => {
                const x = lerp(930, 1150, e);
                const y = 880 - 168 * e;
                const fr = Math.floor((e * 1.9) / 0.27) % 2;
                const bob = -Math.abs(Math.sin((e * 1.9 * Math.PI) / 0.27)) * 6;
                walkShow(x, y + bob, 1 - 0.167 * e, fr);
              },
              lin,

        /* ---------- POV koridor (sudut pandang orang pertama) ---------- */
        const pov = (() => {
          const cv = document.createElement("canvas");
          cv.style.cssText =
            "position:absolute;inset:0;width:100%;height:100%;z-index:1;display:none";
          stage.insertBefore(cv, stage.querySelector(".dusk"));
          const g = cv.getContext("2d");
          const o = { z: 0, on: false, wallet: null, goal: null, dusk: false, crouch: 0, pitch: 0, look: 0, reach: 0, hold: 0, bills: 1, walletOn: true };
          const HW = 2.1, HT = 3.4, ZEND = 60, EYE = 1.55;
          let W = 0, H = 0, f = 0, vx = 0, vy = 0, cx = 0, ey = EYE, cz = 0, T = 0;
          const P = (x, y, z) => [
            vx + ((x - cx) * f) / Math.max(0.2, z - cz),
            vy - ((y - ey) * f) / Math.max(0.2, z - cz),
          ];
          const poly = (pts, fill, a = 1) => {
            if (pts.every((p) => p[2] - cz < 0.2)) return;
            g.globalAlpha = a;
            g.fillStyle = fill;
            g.beginPath();
            pts.forEach((p, i) => {
              const q = P(...p);
              i ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1]);
            });
            g.closePath();
            g.fill();
            g.globalAlpha = 1;
          };
          // bidang di dinding kiri/kanan: z1..z2, y1..y2
          const wall = (s, z1, z2, y1, y2, fill, a) =>
            poly([[s * HW, y1, z1], [s * HW, y1, z2], [s * HW, y2, z2], [s * HW, y2, z1]], fill, a);
          const wtext = (s, txt, z1, z2, y1, y2, col) => {
            const a = P(s * HW, y2, z1), b = P(s * HW, y2, z2), c = P(s * HW, y1, z1);
            const h = c[1] - a[1], w = Math.abs(b[0] - a[0]);
            if (h < 5 || z1 - cz < 0.4) return;
            g.save();
            g.font = `${h * 0.62}px "Patrick Hand", cursive`;
            const m = g.measureText(txt).width || 1;
            g.translate((a[0] + b[0]) / 2, (a[1] + c[1]) / 2 + h * 0.2);
            g.scale(Math.min(1.2, w / m), 1);
            g.fillStyle = col;
            g.textAlign = "center";
            g.fillText(txt, 0, 0);
            g.restore();
          };
          const door = (s, z1, z2, tall) => {
            wall(s, z1 - 0.12, z2 + 0.12, 0, tall + 0.1, "#4a2c16");
            wall(s, z1, z2, 0, tall, "#a8642e");
            wall(s, z1 + 0.12, z2 - 0.12, 1.05, 1.9, "#b9773c", 0.8);
            wall(s, z1, z2, tall * 0.5, tall * 0.5 + 0.03, "#5b3519", 0.7);
          };

          function draw(t) {
            if (!o.on) return;
            const d = Math.min(devicePixelRatio || 1, 1.5);
            const w = Math.round(cv.clientWidth * d), h = Math.round(cv.clientHeight * d);
            if (w !== W || h !== H) { cv.width = W = w; cv.height = H = h; }
            f = Math.max(H * 0.95, W * 0.6);
            vx = W * (0.5 + o.look); vy = H * (0.46 - 0.3 * o.pitch);
            cz = o.z;
            ey = EYE - 0.8 * o.crouch + Math.sin(cz * 4.4) * 0.028 * (1 - o.crouch);
            cx = Math.sin(cz * 2.2) * 0.05 + 0.1;
            T = t;
            const dusk = o.dusk;
            g.clearRect(0, 0, W, H);
            // langit-langit & lantai dasar
            g.fillStyle = "#e9e3d2"; g.fillRect(0, 0, W, H);
            const fl = g.createLinearGradient(0, vy, 0, H);
            fl.addColorStop(0, dusk ? "#f2c58e" : "#f4dfb4");
            fl.addColorStop(1, dusk ? "#b98a5a" : "#c9a577");
            poly([[-HW, 0, cz], [HW, 0, cz], [HW, 0, ZEND], [-HW, 0, ZEND]], fl);
            // dinding dasar
            const wl = g.createLinearGradient(0, 0, W, 0);
            wl.addColorStop(0, "#d9b657"); wl.addColorStop(1, "#d9b657");
            wall(-1, cz, ZEND, 0, HT, "#dcbb5c");
            wall(1, cz, ZEND, 0, HT, "#ebcf74");
            // dinding ujung + jendela hijau
            poly([[-HW, 0, ZEND], [HW, 0, ZEND], [HW, HT, ZEND], [-HW, HT, ZEND]], "#cfae56");
            const wg = g.createLinearGradient(0, P(0, 2.5, ZEND)[1], 0, P(0, 1, ZEND)[1]);
            wg.addColorStop(0, "#fffbe0"); wg.addColorStop(1, "#8fd08a");
            poly([[-1, 1, ZEND], [1, 1, ZEND], [1, 2.5, ZEND], [-1, 2.5, ZEND]], wg);
            for (const bx of [-0.34, 0.34])
              poly([[bx - 0.02, 1, ZEND], [bx + 0.02, 1, ZEND], [bx + 0.02, 2.5, ZEND], [bx - 0.02, 2.5, ZEND]], "#6d5a2a");
            // lantai: garis ubin, strip gelap, bercak matahari
            const z0 = Math.max(0, Math.floor((cz - 1) / 1.2) * 1.2);
            g.strokeStyle = "rgba(90,60,30,.16)"; g.lineWidth = Math.max(1, H / 420);
            for (let z = z0; z < Math.min(ZEND, cz + 40); z += 1.2) {
              if (z - cz < 0.25) continue;
              const a = P(-HW, 0, z), b = P(HW, 0, z);
              g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke();
            }
            for (const sx of [-1, 1])
              poly([[sx * 0.82, 0, cz], [sx * 0.96, 0, cz], [sx * 0.96, 0, ZEND], [sx * 0.82, 0, ZEND]], "#403830");
            // langit-langit: balok & lampu
            const bz = Math.floor((cz - 1) / 3.5) * 3.5;
            for (let z = bz + 3.5; z < Math.min(ZEND, cz + 45); z += 3.5) {
              if (z - cz < 0.25) continue;
              poly([[-HW, HT - 0.28, z + 0.35], [HW, HT - 0.28, z + 0.35], [HW, HT - 0.28, z], [-HW, HT - 0.28, z]], "#e4dcc8");
              poly([[-HW, HT - 0.28, z], [HW, HT - 0.28, z], [HW, HT, z], [-HW, HT, z]], "#d6cfbb");
            }
            for (let z = bz + 5; z < Math.min(ZEND, cz + 45); z += 7) {
              if (z - cz < 0.5) continue;
              const a = P(0.2, HT, z), b = P(0.2, HT - 0.35, z), s = Math.max(2, f * 0.04 / (z - cz));
              g.strokeStyle = "#6c6f74"; g.lineWidth = Math.max(1, s * 0.3);
              g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke();
              g.fillStyle = "#fff6c8"; g.fillRect(b[0] - s, b[1], s * 2, s * 1.4);
            }
            // fitur dinding, dari jauh ke dekat
            const kmax = Math.min(ZEND / 4, Math.ceil((cz + 45) / 4));
            for (let k = kmax; k >= Math.floor(cz / 4) - 1; k--) {
              const a = k * 4;
              if (k % 2 === 0) {
                door(-1, a + 1, a + 2.2, 2.4);
                wall(-1, a + 1.1, a + 2.1, 2.55, 2.8, "#f0c45a");
                wall(-1, a + 2.5, a + 3.3, 1.1, 2, "#f4efe0", 0.9);
                wall(-1, a + 2.6, a + 3.2, 1.3, 1.9, "#d9602f", 0.9);
              } else {
                wall(-1, a + 0.6, a + 3.2, 0.95, 2.55, "#5f4f22");
                const gl = g.createLinearGradient(0, 0, 0, H);
                gl.addColorStop(0, "#fffbe3"); gl.addColorStop(1, "#cfe8c0");
                wall(-1, a + 0.7, a + 3.1, 1.05, 2.45, gl);
                for (let i = 0; i <= 8; i++)
                  wall(-1, a + 0.7 + i * 0.3, a + 0.74 + i * 0.3, 1.05, 2.45, "#7a6a3a");
                wall(-1, a + 0.55, a + 3.25, 0.9, 0.97, "#3d3222");
              }
            }
            const kmax2 = Math.min(ZEND / 3, Math.ceil((cz + 45) / 3));
            for (let k = kmax2; k >= Math.floor(cz / 3) - 1; k--) {
              const a = k * 3;
              if (o.wallet && Math.abs(a + 0.9 - (o.wallet + 2.3)) < 1.2) continue;
              wall(1, a + 0.75, a + 2.15, 0, 2.6, "#7a6128", 0.55);
              door(1, a + 1.05, a + 1.95, 2.4);
              wall(1, a + 0.4, a + 1.5, 0.35, 2.75, "#fff0b0", 0.22);
              poly([[HW, 0, a + 0.1], [HW, 0, a + 1.4], [0.15, 0, a + 0.8], [0.15, 0, a - 0.6]], "#fff4be", 0.3);
            }
            if (o.wallet) { // tangga di kanan
              const a = o.wallet + 2.3;
              wall(1, a, a + 2.4, 0, 2.7, "#2a2f3a");
              wall(1, a + 0.1, a + 2.3, 2.7, 2.78, "#403830");
              wall(1, a + 0.2, a + 2.2, 2.95, 3.3, "#f0c45a");
              wtext(1, "Tangga", a + 0.3, a + 2.1, 2.95, 3.3, "#3a2c16");
              for (let i = 0; i < 5; i++) wall(1, a + 0.2 + i * 0.4, a + 0.5 + i * 0.4, 0.15 * i, 0.15 * i + 0.1, "#5d6270");
            }
            if (o.goal) { // tanda Ruang Guru di kiri
              const a = o.goal;
              wall(-1, a - 0.3, a + 2.8, 2.5, 3.2, "#f0c45a");
              wtext(-1, "Ruang Guru", a - 0.2, a + 2.7, 2.55, 3.15, "#3a2c16");
            }
            // kilau cahaya jendela ujung
            const gg = g.createRadialGradient(vx, vy, 0, vx, vy, H * 0.55);
            gg.addColorStop(0, "rgba(255,252,230,.55)"); gg.addColorStop(1, "rgba(255,252,230,0)");
            g.fillStyle = gg; g.fillRect(0, 0, W, H);
            // pantulan lantai mengilap
            const rf = g.createLinearGradient(0, vy, 0, vy + H * 0.25);
            rf.addColorStop(0, "rgba(255,255,255,.35)"); rf.addColorStop(1, "rgba(255,255,255,0)");
            poly([[-HW, 0, cz + 0.2], [HW, 0, cz + 0.2], [HW, 0, ZEND], [-HW, 0, ZEND]], rf);
            // dompet
            o.q = null;
            if (o.wallet && o.walletOn && (o.hold > 0 || o.wallet - cz > 0.5)) {
              let q = P(1.05, 0, o.wallet), s = (f * 0.36) / Math.max(0.5, o.wallet - cz);
              const hd = o.hold;
              q = [lerp(q[0], W * 0.5, hd), lerp(q[1], H * 0.8, hd)];
              s = lerp(s, H * 0.34, hd);
              o.q = [q[0], q[1], s];
              if (hd < 1) {
                g.fillStyle = "rgba(0,0,0,.25)";
                g.beginPath(); g.ellipse(q[0], q[1], s * 0.62, s * 0.14, 0, 0, 7); g.fill();
              }
              if (o.bills > 0.02) {
                const u = 1 - o.bills;
                g.globalAlpha = o.bills;
                g.fillStyle = "#88c27a"; g.fillRect(q[0] - s * 0.3 - u * s * 0.5, q[1] - s * 0.42 - u * s * 0.8, s * 0.5, s * 0.16);
                g.globalAlpha = 1;
              }
              g.fillStyle = "#7a4a25"; g.strokeStyle = "#3a2210"; g.lineWidth = Math.max(1, s * 0.05);
              g.beginPath(); g.roundRect(q[0] - s * 0.5, q[1] - s * 0.34, s, s * 0.34, s * 0.06); g.fill(); g.stroke();
              g.strokeStyle = "#f2b04c"; g.lineWidth = Math.max(1.5, s * 0.06); g.lineCap = "round";
              g.globalAlpha = (0.55 + 0.45 * Math.sin(T * 4)) * (1 - hd);
              g.beginPath();
              g.moveTo(q[0] - s * 0.65, q[1] - s * 0.55); g.lineTo(q[0] - s * 0.8, q[1] - s * 0.7);
              g.moveTo(q[0], q[1] - s * 0.62); g.lineTo(q[0], q[1] - s * 0.85);
              g.moveTo(q[0] + s * 0.65, q[1] - s * 0.55); g.lineTo(q[0] + s * 0.8, q[1] - s * 0.7);
              g.stroke(); g.globalAlpha = 1;
            }
            // tangan & lengan POV mengayun
            const sw = Math.sin(cz * 4.4) * H * 0.012;
            for (const s of [-1, 1]) {
              if (s === 1 && o.reach > 0.01) continue;
              const x = W / 2 + s * W * 0.2, y = H + sw * -s;
              g.save(); g.translate(x, y); g.rotate(s * -0.18);
              g.fillStyle = "#f4f1ea"; g.beginPath(); g.roundRect(-H * 0.06, -H * 0.17, H * 0.12, H * 0.2, H * 0.03); g.fill();
              g.fillStyle = "#e0ac7e"; g.beginPath(); g.roundRect(-H * 0.05, -H * 0.24, H * 0.1, H * 0.09, H * 0.04); g.fill();
              g.restore();
            }
            // tangan kanan meraih / memegang dompet
            if (o.reach > 0.01 && o.q) {
              const sx = W * 0.82, sy = H * 1.12;
              const tx = o.q[0] + o.q[2] * 0.3 * o.hold, ty = o.q[1] - o.q[2] * 0.1 + o.q[2] * 0.35 * o.hold;
              const ex = lerp(sx, tx, o.reach), ey2 = lerp(sy, ty, o.reach);
              const mx = lerp(sx, ex, 0.62), my = lerp(sy, ey2, 0.62);
              g.lineCap = "round";
              g.strokeStyle = "#f4f1ea"; g.lineWidth = H * 0.12;
              g.beginPath(); g.moveTo(sx, sy); g.lineTo(mx, my); g.stroke();
              g.strokeStyle = "#e0ac7e"; g.lineWidth = H * 0.08;
              g.beginPath(); g.moveTo(mx, my); g.lineTo(ex, ey2); g.stroke();
              g.fillStyle = "#e0ac7e"; g.beginPath(); g.arc(ex, ey2, H * 0.05, 0, 7); g.fill();
            }
            // vinyet
            const vg = g.createRadialGradient(vx, H * 0.45, H * 0.45, vx, H * 0.45, Math.max(W, H) * 0.75);
            vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,.5)");
            g.fillStyle = vg; g.fillRect(0, 0, W, H);
          }
          requestAnimationFrame(function loop(t) { draw(t / 1000); requestAnimationFrame(loop); });
          return {
            o,
            show(opt) { Object.assign(o, { z: 0, wallet: null, goal: null, dusk: false, crouch: 0, pitch: 0, look: 0, reach: 0, hold: 0, bills: 1, walletOn: true }, opt, { on: true }); cv.style.display = "block"; },
            hide() { o.on = false; cv.style.display = "none"; },
            walk(dur, z1) {
              const z0 = o.z;
              return tween(dur, (e) => { o.z = lerp(z0, z1, e); }, lin);
            },
          };
        })();

        async function toCorridor(kind) {
          fadeEl.classList.add("on");
          hideCaption();
          if (!(await wait(1.1))) return;
          cardEl.innerHTML =
            "Bel istirahat berbunyi.<small>Kamu keluar kelas dan berjalan di koridor.</small>";
          cardEl.classList.add("show");
          if (!(await wait(2.4))) return;
          cardEl.classList.remove("show");
          if (!(await wait(0.8))) return;
          stage.classList.add("in-gate", "cinema");
          $("gateScene").style.display = "none";
          $("corridorScene").style.display = "none";
          pov.show({ wallet: 24 });
          fadeEl.classList.remove("on");
          if (!(await wait(1.2))) return;
          const mutter = {
            own: '"Bagus lahh, aku dapat nilai 100!"',
            peek: '"Aduh... kalau aja tadi aku nggak nyontek, pasti dapat nilai 100."',
            blank:

          }[kind];
          setTimeout(() => {

          if (!(await pov.walk(7, 12))) return;
