          if (!(await pov.walk(5.5, 20.5))) return;
          hideCaption();
          caption("Di dekat tangga ada dompet cokelat tergeletak.");
          if (
            !(await Promise.all([
              pov.walk(2.8, 21.2),
              tween(2.8, (e) => { pov.o.pitch = 0.5 * e; }),
            ]).then((r) => r.every(Boolean)))
          )
            return;
          if (!(await wait(0.6))) return;
          hideCaption();
          caption("Uang menyembul dari dalamnya. Tidak ada yang melihat.");
          if (!(await wait(2.6))) return;
          hideCaption();
          state = "wallet-ask";
          walletChEl.classList.add("show");
        }

        /* ============ CERITA 4: dompet di koridor ============ */
        const KX = 1246,
          KY = 800,
          KS = 1.25,
          WS = 1.3,
          BEND = { rot: 58, th: 64 };
        const walletEl = $("walletG"),
          billsEl = $("walletBillsG"),
          sparkEl = $("walletSpark"),
          walletChEl = $("walletChoices");

        // posisi ujung tangan murid (lengan A) bila badan condong `rot` dan lengan terayun `th`
        function handAt(x, y, s, face, rot, th) {
          const d = face === "R" ? 1 : -1,
            r = (rot * Math.PI) / 180,
            t = ((th - rot) * Math.PI) / 180;
          return {
            x: x + d * (118 * s * Math.sin(r) + 52 * s * Math.sin(t)),
            y: y - 118 * s * Math.cos(r) + 52 * s * Math.cos(t),
          };
        }
        const HG = handAt(KX, KY, KS, "R", BEND.rot, BEND.th);
        const setWallet = (x, y, s) =>
          walletEl.setAttribute(
            "transform",
            `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${s.toFixed(3)})`,
          );
        setWallet(HG.x, HG.y + 18 * WS, WS);

        /* jongkok: lutut menekuk, pinggul turun & mundur, punggung condong, tangan meraih dompet */
        const SQ = { dx: 95, lean: 48, drop: 40, back: 22, fa: -16, fb: -8 };
        const D2R = Math.PI / 180;
        function sqShoulder(c, x0) {
          const L = SQ.lean * c * D2R,
            hx = SQ.back * c,
            d = SQ.drop * c;
          return {
            L,
            hx,
            d,
            x: x0 + KS * 52 * Math.sin(L) - KS * hx,
            y: KY + KS * (-66 + d - 52 * Math.cos(L)),
          };
        }
        function sqTh(c, x0 = KX + SQ.dx) {
          const sh = sqShoulder(c, x0);
          const t = Math.atan2(HG.x - sh.x, HG.y - sh.y) / D2R;
          return lerp(4, t + SQ.lean * c, c);
        }
        function sqPose(c, th, x0 = KX + SQ.dx) {
          const sh = sqShoulder(c, x0);
          if (th === undefined) th = sqTh(c, x0);
          place(kid, x0, KY, KS, "R");
          const hip = { x: sh.hx, y: -66 + sh.d };
          [SQ.fa, SQ.fb].forEach((fx, i) => {
            const l = kid.legs[i],
              foot = { x: fx * c, y: -4 };
            const vx = foot.x - hip.x,
              vy = foot.y - hip.y,
              D = Math.min(Math.hypot(vx, vy), 61.9);
            const h = Math.sqrt(31 * 31 - (D / 2) * (D / 2));
            const kx = hip.x + vx / 2 - (vy / D) * h,
              ky = hip.y + vy / 2 + (vx / D) * h;
            l.g.removeAttribute("transform");
            l.orig.forEach((e) => (e.style.display = "none"));
            l.grp.style.display = "";
            const set = (n, p) =>
              Object.entries(p).forEach(([k, v]) =>
                n.setAttribute(k, v.toFixed(1)),
              );
            set(l.th, { x1: hip.x, y1: hip.y, x2: kx, y2: ky });
            set(l.sh, { x1: kx, y1: ky, x2: foot.x, y2: foot.y });
            set(l.shoe, { x: foot.x - 14 });
          });
          kid.up.setAttribute(
            "transform",
            `translate(${sh.hx.toFixed(1)} ${sh.d.toFixed(1)}) rotate(${(-SQ.lean * c).toFixed(1)} 0 -66)`,
          );
          rotAt(kid.aa, th);
          rotAt(kid.ab, lerp(-4, 28, c));
          const t = (th - SQ.lean * c) * D2R;
          return {
            x: sh.x + KS * 52 * Math.sin(t),
            y: sh.y + KS * 52 * Math.cos(t),
          };
        }
        function wlPose(c, th, x0) {
          return sqPose(c, th, x0);
        }
        function wlHold(c, s, th) {
          const h = sqPose(c, th);
          setWallet(h.x, h.y + 18 * s, s);
        }
        function stepIn() {
          return tween(
            0.8,
            (e) => {
              const x = lerp(KX, KX + SQ.dx, e);
              place(kid, x, KY, KS, "R");
              walkPose(kid, x * 0.045, 28, 30);
            },
            lin,
          );
        }
        async function walkAway(carry, x0 = KX) {
          camTo({ cx: 850, cy: 560, w: 1100, h: 640 }, 0, 2.6);
          return await tween(
            4.2,
            (e) => {
              const x = lerp(x0, 380, e),
                op = e > 0.72 ? 1 - (e - 0.72) / 0.28 : 1;
              place(kid, x, KY, KS, "L");
              walkPose(kid, x * 0.05, 28, 30);
              kidOpacity(op);
              if (carry) {
                rotAt(kid.aa, 55);
                const h = handAt(x, KY, KS, "L", 0, 55);
                setWallet(h.x, h.y + 16, 0.9);
                walletEl.setAttribute("opacity", op.toFixed(2));
              }
            },
            lin,
          );
        }

        function chooseWallet(k) {
          if (state !== "wallet-ask") return;
          state = "wallet-scene";
          walletChEl.classList.remove("show");
          ({ give: walletGive, take: walletTake, ignore: walletIgnore })[k]();
        }

        /* pilihan 1: serahkan ke ruang guru */
        async function wlPick() {
          if (!(await tween(1.0, (e) => wlPose(e, lerp(4, 10, e)))))
            return false;
          if (!(await wait(0.45))) return false;
          if (!(await tween(0.8, (e) => wlPose(1, lerp(10, sqTh(1), e)))))
            return false;
          sparkEl.style.display = "none";
          return await tween(0.4, (e) =>
            wlPose(1, sqTh(1) + 7 * Math.sin(Math.PI * e)),
          );
        }
        /* ---- versi POV: mengambil dompet dari sudut pandang sendiri ---- */
        const both = async (...p) => (await Promise.all(p)).every(Boolean);
        async function povPick() {
          const o = pov.o;
          if (!(await both(pov.walk(1.1, 22.4), tween(1.1, (e) => { o.pitch = lerp(0.5, 0.65, e); })))) return false;
          if (!(await tween(0.9, (e) => { o.crouch = e; }))) return false;
          return await tween(0.8, (e) => { o.reach = e; });
        }
        const povLift = () =>
          tween(1.2, (e) => {
            const o = pov.o;
            o.hold = e; o.crouch = 1 - e; o.pitch = lerp(0.65, 0.25, e);
          });
        const povWalkOff = (z, from) =>
          both(pov.walk(4.4, z), tween(1, (e) => { pov.o.pitch = lerp(from, 0, e); }));

        async function walletGive() {
          const o = pov.o;
          hideCaption();
          if (!(await povPick())) return;
          caption("Kamu memungut dompet itu.");
          if (!(await povLift())) return;
          if (!(await wait(0.5))) return;
          caption("Kamu membawanya ke ruang guru.");
          o.goal = 30;
          if (!(await povWalkOff(29, 0.25))) return;
          o.walletOn = false;
          caption("Dompetnya sudah kamu serahkan. Rasanya lega.");
          if (!(await tween(0.8, (e) => { o.reach = 1 - e; }))) return;
          if (!(await wait(2.2))) return;
          award("dompet", "give");
          toBell();
        }

        async function walletTake() {
          const o = pov.o;
          hideCaption();
          if (!(await povPick())) return;
          caption("Tidak ada yang melihat... uangnya kamu ambil.");
          if (!(await povLift())) return;
          if (!(await tween(0.8, (e) => { o.bills = 1 - e; }, lin))) return;
          caption("Lalu dompetnya kamu taruh kembali.");
          if (!(await tween(1.1, (e) => { o.hold = 1 - e; o.crouch = e; o.pitch = lerp(0.25, 0.65, e); }))) return;
          if (!(await tween(1, (e) => { o.reach = 1 - e; o.crouch = 1 - e; o.pitch = lerp(0.65, 0.3, e); }))) return;
          if (!(await wait(1.2))) return;
          caption("Kamu pergi, seolah tidak terjadi apa-apa.");
          if (!(await povWalkOff(28, 0.3))) return;
          if (!(await wait(1.6))) return;
          award("dompet", "take");
          toBell();
        }

        /* pilihan 3: biarkan saja */
        async function walletIgnore() {
          const o = pov.o;
          hideCaption();
          caption("Kamu melirik dompet itu...");
          if (
            !(await tween(1.8, (e) => {
              const k = Math.sin(Math.PI * e);
              o.pitch = 0.5 + 0.25 * k;
              o.look = -0.05 * k;
            }))
          )
            return;
          hideCaption();
          caption("...lalu pura-pura tidak melihat dan berjalan pergi.");
          if (!(await povWalkOff(28, 0.5))) return;
          hideCaption();
          caption("Dompet itu tetap tergeletak di sana.");
          if (!(await wait(3))) return;
          award("dompet", "ignore");
          toBell();
        }

        walletChEl.addEventListener("click", (e) => {
          const b = e.target.closest(".choice");
          if (b) chooseWallet(b.dataset.w);
        });

        /* ============ CERITA 5: dipanggil guru ============ */
        function enterCorridor() {
          stage.classList.add("in-gate", "cinema");
          $("gateScene").style.display = "none";
          $("roomScene").style.display = "none";
          $("corridorScene").style.display = "";
          gsvg.appendChild(kid.g);
          kidOpacity(1);
          idlePose(kid);
          Object.assign(cam, CAM.corridor);
          par = 0;
        }

        function buildRoom() {
          const bills =
            story.dompet === "take" ? "" : '<use href="#walletBills"/>';
          let r = `<rect x="-800" y="-600" width="4000" height="1900" fill="#f6efdc"/>`;
          r += `<rect x="-800" y="-600" width="4000" height="896" fill="#1f2d3d"/><rect x="-800" y="296" width="4000" height="10" fill="#f2b04c"/>`;
          r += `<rect x="650" y="322" width="300" height="48" rx="8" fill="#f2b04c" stroke="#1f2d3d" stroke-width="4"/>`;
          r += `<text x="800" y="358" text-anchor="middle" font-size="32" fill="#1f2d3d" font-family="${HAND}">Ruang Guru</text>`;
          // jendela
          r += `<rect x="170" y="340" width="220" height="250" fill="#f2b04c" stroke="#1f2d3d" stroke-width="6"/>`;
          r += `<line x1="280" y1="340" x2="280" y2="590" stroke="#1f2d3d" stroke-width="5"/><line x1="170" y1="465" x2="390" y2="465" stroke="#1f2d3d" stroke-width="5"/>`;
          r += `<rect x="156" y="590" width="248" height="14" fill="#1f2d3d"/>`;
          // papan pengumuman
          r += `<rect x="1170" y="350" width="270" height="230" fill="none" stroke="#1f2d3d" stroke-width="6"/>`;
          r += `<rect x="1196" y="376" width="70" height="86" fill="#f2b04c" stroke="#1f2d3d" stroke-width="3.5"/>`;
          r += `<rect x="1290" y="372" width="64" height="70" fill="#f6efdc" stroke="#1f2d3d" stroke-width="3.5"/>`;
          r += `<rect x="1376" y="384" width="42" height="96" fill="#f2b04c" stroke="#1f2d3d" stroke-width="3.5"/>`;
          r += `<rect x="1210" y="486" width="120" height="64" fill="#f6efdc" stroke="#1f2d3d" stroke-width="3.5"/>`;
          r += `<g stroke="#1f2d3d" stroke-width="3" stroke-linecap="round"><line x1="1222" y1="506" x2="1318" y2="506"/><line x1="1222" y1="522" x2="1300" y2="522"/><line x1="1222" y1="538" x2="1280" y2="538"/></g>`;
          // lantai
          r += `<rect x="-800" y="772" width="4000" height="14" fill="#1f2d3d"/><rect x="-800" y="786" width="4000" height="900" fill="#1f2d3d" opacity=".14"/>`;
          for (let x = -800; x < 2400; x += 210)
            r += `<line x1="${x}" y1="786" x2="${x}" y2="1500" stroke="#1f2d3d" stroke-opacity=".12" stroke-width="3"/>`;
          // Bu Guru
          r += `<g id="buGuru">`;
          r += `<line x1="752" y1="548" x2="722" y2="630" stroke="#1f2d3d" stroke-width="24" stroke-linecap="round"/><line x1="848" y1="548" x2="878" y2="630" stroke="#1f2d3d" stroke-width="24" stroke-linecap="round"/>`;
          r += `<path d="M740 700 Q738 536 800 526 Q862 536 860 700 Z" fill="#1f2d3d"/>`;
          r += `<polygon points="778,526 800,556 822,526" fill="#f6efdc"/><rect x="790" y="504" width="20" height="24" fill="#f2b04c" stroke="#1f2d3d" stroke-width="3"/>`;
          r += `<circle cx="722" cy="638" r="12" fill="#f2b04c" stroke="#1f2d3d" stroke-width="3"/><circle cx="878" cy="638" r="12" fill="#f2b04c" stroke="#1f2d3d" stroke-width="3"/>`;
          r += `<circle cx="800" cy="414" r="22" fill="#1f2d3d"/>`;
          r += `<circle cx="800" cy="472" r="42" fill="#f2b04c" stroke="#1f2d3d" stroke-width="4"/>`;
          r += `<path d="M758 470 C752 418 848 418 842 470 C828 446 772 446 758 470 Z" fill="#1f2d3d"/>`;
          r += `<g fill="none" stroke="#1f2d3d" stroke-width="3"><circle cx="786" cy="476" r="10"/><circle cx="814" cy="476" r="10"/><line x1="796" y1="476" x2="804" y2="476"/></g>`;
          r += `<circle cx="786" cy="476" r="2.6" fill="#1f2d3d"/><circle cx="814" cy="476" r="2.6" fill="#1f2d3d"/>`;
          r += `<path d="M784 497 q16 15 32 0" stroke="#1f2d3d" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
          r += `</g>`;
          // meja
          r += `<rect x="540" y="640" width="520" height="26" fill="#f2b04c" stroke="#1f2d3d" stroke-width="4"/>`;
          r += `<rect x="560" y="666" width="480" height="114" fill="#1f2d3d"/><rect x="600" y="690" width="170" height="70" fill="none" stroke="#f6efdc" stroke-opacity=".35" stroke-width="3"/><rect x="830" y="690" width="170" height="70" fill="none" stroke="#f6efdc" stroke-opacity=".35" stroke-width="3"/>`;
          // barang di meja
          r += `<rect x="570" y="612" width="100" height="28" fill="#f2b04c" stroke="#1f2d3d" stroke-width="3.5"/><rect x="578" y="588" width="84" height="24" fill="#f6efdc" stroke="#1f2d3d" stroke-width="3.5"/>`;
          r += `<rect x="1018" y="604" width="30" height="36" rx="4" fill="#f6efdc" stroke="#1f2d3d" stroke-width="3.5"/><path d="M1048 612 q14 4 0 16" fill="none" stroke="#1f2d3d" stroke-width="3.5"/>`;
          r += `<g transform="translate(950 640) scale(1.1)">${bills}<use href="#walletBody"/></g>`;
          // kartu tertutup
          r +=
            `<g id="deskCard" transform="translate(800 640)"><rect x="-46" y="-72" width="92" height="72" rx="8" fill="#f2b04c" stroke="#1f2d3d" stroke-width="4"/>` +
            `<rect x="-37" y="-63" width="74" height="54" rx="4" fill="none" stroke="#1f2d3d" stroke-width="2.5" stroke-dasharray="6 5"/>` +
            `<text x="0" y="-22" text-anchor="middle" font-size="46" fill="#1f2d3d" font-family="${HAND}">?</text></g>`;
          $("roomScene").innerHTML = r;
        }

        async function toBell() {
          state = "bell";
          hideCaption();
          fadeEl.classList.add("on");
          if (!(await wait(1.1))) return;
          cardEl.innerHTML =
            "Bel pulang berbunyi.<small>Langit mulai jingga. Sekolah hampir kosong.</small>";
          cardEl.classList.add("show");
          if (!(await wait(2.6))) return;
          cardEl.classList.remove("show");
          if (!(await wait(0.8))) return;
          walletEl.style.display = "none";
          enterCorridor();
          $("corridorScene").style.display = "none";
          pov.show({ dusk: true, goal: 27 });
          stage.classList.add("dusk-on");
          fadeEl.classList.remove("on");
          if (!(await wait(1.2))) return;
          state = "to-teacher";
          caption(
            'Pengeras suara: "Murid yang duduk di meja paling depan, tolong ke ruang guru sebentar."',
          );
          if (!(await pov.walk(5.5, 13))) return;
          hideCaption();
          caption(
            "Kamu berjalan di koridor yang kosong dengan perasaan campur aduk.",
          );
          if (!(await pov.walk(5, 26))) return;
          idlePose(kid);
          hideCaption();
          fadeEl.classList.add("on");
          if (!(await wait(1.1))) return;

          // ruang guru
          buildRoom();
          pov.hide();
          $("corridorScene").style.display = "none";
          $("roomScene").style.display = "";
          Object.assign(cam, CAM.room);
          place(kid, -140, 900, 1.5, "R");
          fadeEl.classList.remove("on");
          if (!(await wait(0.9))) return;
          if (
            !(await tween(
              3.2,
              (e) => {
                const x = lerp(-140, 430, e);
                place(kid, x, 900, 1.5, "R");
                walkPose(kid, x * 0.05, 28, 30);
              },
              lin,
            ))
          )
            return;
          idlePose(kid);
          state = "teacher";
          camTo(CAM.deskCard, 0, 2.4);
          caption("Di meja guru ada kartu kecil yang tertutup.");
          if (!(await wait(3))) return;
          caption(
            "Di sebelahnya, ada dompet cokelat yang terasa tidak asing...",
          );
          if (!(await wait(3.2))) return;
          caption('Bu Guru tersenyum: "Ibu mau kasih ini."');
          if (!(await wait(2.6))) return;
          caption('"Sebenarnya, kamu itu orangnya seperti apa, ya?"');
          if (!(await wait(3.4))) return;
          hideCaption();
          showReveal();
        }

        /* ---------- penilaian karakter ---------- */
        const TRAITS = [
          ["disiplin", "Disiplin"],
          ["jujur", "Kejujuran"],
          ["tanggung", "Tanggung Jawab"],
          ["peduli", "Kepedulian"],
        ];
        const NOTES = {
          gate: {
            climb:
              "Pagi tadi Ibu lihat kamu memanjat pagar. Berani, tapi lain kali bicara saja ke Pak Satpam.",
            tell: "Pagi tadi kamu berani mengaku terlambat kepada Pak Satpam. Itu tidak mudah.",
            back: "Pagi tadi kamu menyelinap lewat pintu belakang. Ibu tahu, lho.",
          },
          kelas: {
            now: "Tugasmu kamu kerjakan dan kumpulkan tepat waktu.",
            later: "Tugasmu hampir saja terlewat karena kamu tunda.",
            skip: "Tugasmu tidak kamu kerjakan sama sekali.",
          },
          ulangan: {
            own: "Di ulangan, kamu menjawab dengan usahamu sendiri.",
            peek: "Di ulangan, kamu menyalin jawaban temanmu.",
            blank: "Di ulangan, kamu menyerah sebelum mencoba.",
          },
          dompet: {
            give: "Dompet cokelat di dekat tangga itu milik Ibu, sengaja Ibu taruh di sana. Kamu menyerahkannya dengan utuh. Terima kasih.",
            take: "Dompet cokelat di dekat tangga itu milik Ibu, sengaja Ibu taruh di sana. Uangnya berkurang, dan Ibu tahu siapa yang lewat.",
            ignore:
              "Dompet cokelat di dekat tangga itu milik Ibu, sengaja Ibu taruh di sana. Kamu melihatnya, tapi memilih pura-pura tidak tahu.",
          },
        };
        const HOMEWORK = {
          disiplin: "PR-mu: lebih tertib mengatur waktu.",
          jujur: "PR-mu: tetap jujur walau tidak ada yang melihat.",
          tanggung: "PR-mu: selesaikan apa yang menjadi tanggung jawabmu.",
          peduli: "PR-mu: lebih peka pada barang dan perasaan orang lain.",
        };
        function traitNorm(k) {
          let lo = 0,
            hi = 0;
          Object.values(POINTS).forEach((g) => {
            const v = Object.values(g).map((o) => o[k] || 0);
            lo += Math.min(...v);
            hi += Math.max(...v);
          });
          return hi === lo ? 0.5 : clamp01((score[k] - lo) / (hi - lo));
        }
        function evaluate() {
          const ks = TRAITS.map((t) => t[0]),
            label = (k) => TRAITS.find((t) => t[0] === k)[1];
          const n = {};
          ks.forEach((k) => (n[k] = traitNorm(k)));
          const hi = ks.filter((k) => n[k] >= 0.7),
            lo = ks.filter((k) => n[k] <= 0.35);
          const top = ks.reduce((a, b) => (n[b] > n[a] ? b : a));
          const bot = ks.reduce((a, b) => (n[b] < n[a] ? b : a));
          let title;
          if (ks.every((k) => n[k] >= 0.75)) title = "Murid Teladan";
          else if (n.jujur <= 0.35)
            title =
              lo.length >= 3
                ? "Si Jago Cari Celah"
                : hi.length >= 2
                  ? "Si Pintar yang Suka Jalan Pintas"
                  : "Si Pencari Jalan Pintas";
          else if (story.dompet === "take")
            title =
              hi.length >= 2
                ? "Si Baik yang Sempat Tergoda"
                : "Si Pencari Jalan Pintas";
          else if (lo.length >= 3) title = "Si Santai Sejati";
          else if (lo.length === 1 && hi.length >= 2)
            title = {
              peduli: "Si Rajin yang Kurang Peka",
              disiplin: "Si Baik yang Sering Terlambat",
              tanggung: "Si Baik yang Suka Menunda",
            }[lo[0]];
          else if (n.jujur >= 0.7 && n.peduli >= 0.7) title = "Penjaga Amanah";
          else if (n.jujur >= 0.7 && n.disiplin >= 0.7) title = "Si Lurus Hati";
          else if (n.tanggung >= 0.7 && n.disiplin >= 0.7)
            title = "Si Andalan Kelas";
          else if (n.tanggung >= 0.7 && n.peduli >= 0.7)
            title = "Si Hati Hangat";
          else if (n[top] < 0.6) title = "Murid yang Sedang Bertumbuh";
          else
            title = {
              disiplin: "Si Tertib",
              jujur: "Si Jujur",
              tanggung: "Si Bertanggung Jawab",
              peduli: "Si Peduli",
            }[top];

          const pr = story.dompet === "take" ? "jujur" : bot;
          const closing = ks.every((k) => n[k] >= 0.75)
            ? "Pertahankan, ya. Ibu bangga padamu."
            : HOMEWORK[pr];
          const note = [
            NOTES.gate[story.gate],
            NOTES.kelas[story.kelas],
            NOTES.ulangan[story.ulangan],
            NOTES.dompet[story.dompet],
            closing,
          ]
            .filter(Boolean)
            .join(" ");
          const sub = ks.every((k) => n[k] >= 0.75)
            ? "Keempat sifatmu sama-sama kuat."
            : "Paling kuat: " +
              label(top) +
              (bot !== top && n[bot] < 0.7
                ? " \u00b7 Perlu dilatih: " + label(bot)
                : "");
          return {
            title,
            sub,
            note,
            bars: TRAITS.map(([k, l]) => ({
              label: l,
              pct: Math.max(6, Math.round(n[k] * 100)),
            })),
          };
        }

        const revealEl = $("reveal");
        async function showReveal() {
          state = "final";
          stage.classList.remove("cinema");
          hideCaption();
          const r = evaluate();
          $("rTitle").textContent = r.title;
          $("rSub").textContent = r.sub;
          $("rNote").textContent = r.note;
          $("rBars").innerHTML = r.bars
            .map(
              (b) =>
                `<div class="trait"><span>${b.label}</span><i><b data-w="${b.pct}"></b></i></div>`,
            )
            .join("");
          revealEl.classList.add("show");
          if (!(await wait(1.6))) return;
          revealEl.classList.add("flipped");
          if (!(await wait(1.2))) return;
          revealEl.querySelectorAll("b[data-w]").forEach((b) => {
            b.style.width = b.dataset.w + "%";
          });
        }
        $("rAgain").addEventListener("click", () => {
          location.hash = "";
          location.reload();
        });

        examChEl.addEventListener("click", (e) => {
          const b = e.target.closest(".choice");
          if (b) chooseExam(b.dataset.e);
        });
        againEl.addEventListener("click", () => {
          location.hash = "";
          location.reload();
        });

        /* ---------- input ---------- */
        function choose(k) {
          if (state !== "ask") return;
          ({ now: sceneNow, later: sceneLater, skip: sceneSkip })[k]();
        }
        choicesEl.addEventListener("click", (e) => {
          const b = e.target.closest(".choice");
          if (b) choose(b.dataset.k);
        });
        addEventListener("keydown", (e) => {
          if (state === "gate-ask") {
            const m = { 1: "climb", 2: "tell", 3: "back" }[e.key];
            if (m) chooseGate(m);
            return;
          }
          if (state === "exam-ask") {
            const m = { 1: "own", 2: "peek", 3: "blank" }[e.key];
            if (m) chooseExam(m);
            return;
          }
          if (state === "wallet-ask") {
            const m = { 1: "give", 2: "take", 3: "ignore" }[e.key];
            if (m) chooseWallet(m);
            return;
          }
          if (e.key === "1") choose("now");
          else if (e.key === "2") choose("later");
          else if (e.key === "3") choose("skip");
        });

        /* ---------- loop utama ---------- */
        let last = performance.now();
        function frame(now) {
          const dt = Math.min(0.1, (now - last) / 1000);
          last = now;
          clock.sec += dt * clock.f;
          if (state === "gate-ask") {
            const t = now / 1000;
            place(kid, 930, 880 + Math.sin(t * 7) * 1.8, 1.2, "L");
            idlePose(kid, t * 7);
            idlePose(guard, t * 2);
          } else if (state === "wallet-ask") {
            const t = now / 1000;
            place(kid, KX, KY + Math.sin(t * 7) * 1.8, KS, "R");
            idlePose(kid, t * 7);
          }
          renderClock();
          renderCam(now / 1000);
          requestAnimationFrame(frame);
        }
        renderParallax();
        requestAnimationFrame(frame);

        /* ---------- pembuka ---------- */
        if (location.hash === "#kelas") enterClass();
        else if (location.hash === "#ulangan") toExam();
        else if (location.hash === "#dompet") toCorridor("own");
        else if (location.hash === "#guru") {
          award("gate", "tell");
          award("kelas", "now");
          award("ulangan", "own");
          award("dompet", "give");
          toBell();
        } else gateStart();
      })();
    </script>
  </body>
</html>
