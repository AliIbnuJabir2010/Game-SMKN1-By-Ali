<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0f14" />
    <meta name="color-scheme" content="dark" />
    <title>Kuis Kelas — Prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --chalk: #1d3b66;
        --amber: #ffd98a;
        --ink: #0b0f14;
        --glass: rgba(16, 20, 26, 0.58);
        --glass-hi: rgba(26, 32, 40, 0.82);
        --line: rgba(255, 255, 255, 0.16);
        --hand:
          "Patrick Hand", "Segoe Print", "Bradley Hand", "Chalkboard SE",
          "Comic Sans MS", cursive;
        --ui:
          system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial,
          sans-serif;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        overscroll-behavior: none;
        font-family: var(--ui);
        color: #fff;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
      }

      .stage {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: #0b0f14;
      }
      #world {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      /* ---------- lapisan sinematik ---------- */
      .vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 2;
        background: radial-gradient(
          ellipse at 50% 42%,
          transparent 52%,
          rgba(0, 0, 0, 0.52) 100%
        );
      }
      .dusk {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 3;
        opacity: 0;
        transition: opacity 3.5s ease;
        background: linear-gradient(
          180deg,
          rgba(255, 170, 80, 0.1),
          rgba(255, 110, 40, 0.24)
        );
      }
      .stage.dusk-on .dusk {
        opacity: 1;
      }
      .bar {
        position: absolute;
        left: 0;
        right: 0;
        height: 0;
        background: #000;
        z-index: 4;
        pointer-events: none;
        transition: height 1.1s cubic-bezier(0.6, 0, 0.2, 1);
      }
      .bar.t {
        top: 0;
      }
      .bar.b {
        bottom: 0;
      }
      .stage.cinema .bar {
        height: max(7vh, 28px);
      }
      .intro {
        position: absolute;
        inset: 0;
        background: #000;
        z-index: 9;
        pointer-events: none;
        animation: introOut 1.8s 0.15s ease forwards;
      }
      @keyframes introOut {
        to {
          opacity: 0;
        }
      }

      /* ---------- papan tulis ---------- */
      .chalk {
        font-family: var(--hand);
        font-size: 40px;
        fill: var(--chalk);
        text-anchor: middle;
        opacity: 0;
        animation: chalkIn 1s ease forwards;
      }
      .chalk.l1 {
        animation-delay: 0.9s;
      }
      .chalk.l2 {
        animation-delay: 1.7s;
      }
      .chalk.l3 {
        animation-delay: 2.5s;
      }
      @keyframes chalkIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 0.95;
        }
      }

      /* ---------- jari mengetuk meja ---------- */
      .fg {
        transform-box: fill-box;
      }
      .stage.tapping .fg {
        animation: tap 0.64s ease-in-out infinite;
      }
      .stage.tapping .fg:nth-child(2) {
        animation-delay: 0.14s;
      }
      .stage.tapping .fg:nth-child(3) {
        animation-delay: 0.28s;
      }
      .stage.tapping .fg:nth-child(4) {
        animation-delay: 0.42s;
      }
      @keyframes tap {
        0%,
        100% {
          transform: translateY(0);
        }
        45% {
          transform: translateY(7px);
        }
      }

      /* ---------- UI ---------- */
      .choices {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 5;
        padding: 56px 14px calc(16px + env(safe-area-inset-bottom));
        background: linear-gradient(
          to top,
          rgba(4, 6, 9, 0.78),
          rgba(4, 6, 9, 0.34) 55%,
          transparent
        );
        opacity: 0;
        transform: translateY(18px);
        pointer-events: none;
        transition:
          opacity 0.55s ease,
          transform 0.55s ease;
      }
      .choices.show {
        opacity: 1;
        transform: none;
        pointer-events: auto;
      }
      .row {
        display: grid;
        gap: 10px;
        max-width: 980px;
        margin: 0 auto;
      }
      @media (min-width: 760px) {
        .row {
          grid-template-columns: repeat(3, 1fr);
          gap: 14px;
        }
      }

      .choice {
        appearance: none;
        border: 1px solid var(--line);
        background: var(--glass);
        color: #f6f3ea;
        -webkit-backdrop-filter: blur(10px) saturate(1.2);
        backdrop-filter: blur(10px) saturate(1.2);
        border-radius: 14px;
        padding: 14px 16px;
        display: flex;
        align-items: center;
        gap: 14px;
        font: 600 clamp(16px, 2.3vw, 19px)/1.25 var(--ui);
        text-align: left;
        cursor: pointer;
        min-height: 56px;
        transition:
          transform 0.2s ease,
          background 0.2s ease,
          border-color 0.2s ease;
      }
      .choices.show .choice {
        animation: rise 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
      }
      .choices.show .choice:nth-child(2) {
        animation-delay: 0.09s;
      }
      .choices.show .choice:nth-child(3) {
        animation-delay: 0.18s;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
      }
      .choice .k {
        flex: none;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        border: 1.5px dashed rgba(255, 217, 138, 0.75);
        color: var(--amber);
        font: 400 20px/1 var(--hand);
      }
      .choice:hover {
        transform: translateY(-3px);
        background: var(--glass-hi);
        border-color: rgba(255, 217, 138, 0.65);
      }
      .choice:active {
        transform: scale(0.98);
      }
      .choice:focus-visible,
      .back:focus-visible {
        outline: 2px solid var(--amber);
        outline-offset: 3px;
      }

      .caption {
        position: absolute;
        left: 50%;
        bottom: calc(max(7vh, 28px) + 76px + env(safe-area-inset-bottom));
        z-index: 5;
        transform: translate(-50%, 10px);
        opacity: 0;
        pointer-events: none;
        max-width: 88vw;
        text-align: center;
        padding: 10px 20px;
        border-radius: 26px;
        background: rgba(10, 12, 16, 0.56);
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        border: 1px solid var(--line);
        font: 400 clamp(19px, 3.2vw, 26px)/1.25 var(--hand);
        letter-spacing: 0.3px;
        color: #fff;
        transition:
          opacity 0.8s ease,
          transform 0.8s ease;
      }
      .caption.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      .back {
        position: absolute;
        left: 50%;
        bottom: calc(max(7vh, 28px) + 14px + env(safe-area-inset-bottom));
        z-index: 5;
        transform: translate(-50%, 10px);
        opacity: 0;
        pointer-events: none;
        appearance: none;
        border: 1px solid var(--line);
        background: var(--glass);
        color: #f6f3ea;
        cursor: pointer;
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        border-radius: 999px;
        padding: 12px 22px;
        min-height: 48px;
        font: 600 15px/1 var(--ui);
        transition:
          opacity 0.6s ease,
          transform 0.6s ease,
          background 0.2s ease,
          border-color 0.2s ease;
      }
      .back.show {
        opacity: 1;
        transform: translate(-50%, 0);
        pointer-events: auto;
      }
      .back:hover {
        background: var(--glass-hi);
        border-color: rgba(255, 217, 138, 0.65);
      }

      /* ---------- adegan gerbang (datar, dua warna) ---------- */
      #gate {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: none;
      }
      .stage.in-gate #gate {
        display: block;
      }
      .stage.in-gate #world {
        display: none;
      }
      .stage.in-gate .vignette {
        opacity: 0;
      }
      .choices.flat {
        background: none;
      }
      .askwrap {
        text-align: center;
        margin: 0 auto 14px;
      }
      .ask {
        display: inline-block;
        max-width: 92vw;
        padding: 9px 22px;
        border-radius: 999px;
        background: rgba(10, 12, 16, 0.74);
        border: 1px solid var(--line);
        font: 400 clamp(22px, 3.6vw, 30px)/1.25 var(--hand);
        color: #fff;
      }
      .fade {
        position: absolute;
        inset: 0;
        background: #000;
        z-index: 8;
        opacity: 0;
        pointer-events: none;
        transition: opacity 1s ease;
      }
      .fade.on {
        opacity: 1;
      }
      .card {
        position: absolute;
        inset: 0;
        z-index: 9;
        display: grid;
        place-content: center;
        text-align: center;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.9s ease;
        padding: 0 8vw;
        font: 400 clamp(28px, 5.4vw, 48px)/1.3 var(--hand);
        color: var(--amber);
      }
      .card.show {
        opacity: 1;
      }
      .card small {
        display: block;
        margin-top: 12px;
        font: 400 clamp(18px, 3vw, 26px)/1.35 var(--hand);
        color: #f3f5ec;
        opacity: 0.85;
      }

      /* ---------- kartu karakter dari Bu Guru ---------- */
      .reveal {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        padding: 14px;
        background: rgba(6, 8, 12, 0.62);
        opacity: 0;
        pointer-events: none;
        perspective: 1600px;
        transition: opacity 0.8s ease;
      }
      .reveal.show {
        opacity: 1;
        pointer-events: auto;
      }
      .flip {
        display: grid;
        width: min(94vw, 520px);
        transform-style: preserve-3d;
        transition: transform 1.3s cubic-bezier(0.3, 0.7, 0.2, 1);
      }
      .reveal.flipped .flip {
        transform: rotateY(180deg);
      }
      .face {
        grid-area: 1/1;
        border-radius: 22px;
        background: #f6efdc;
        color: #1f2d3d;
        border: 4px solid #1f2d3d;
        box-shadow:
          0 0 0 6px #f2b04c,
          0 26px 64px rgba(0, 0, 0, 0.55);
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
      }
      .face.front {
        display: grid;
        place-content: center;
        gap: 6px;
        text-align: center;
        min-height: 300px;
      }
      .face.front span {
        font: 400 clamp(120px, 32vw, 200px)/1 var(--hand);
        color: #f2b04c;
        text-shadow: 0 4px 0 #1f2d3d;
      }
      .face.front small {
        font: 400 clamp(20px, 4vw, 26px)/1.2 var(--hand);
      }
      .face.rear {
        transform: rotateY(180deg);
      }
      .scroll {
        max-height: min(82vh, 700px);
        overflow-y: auto;
        padding: 22px 22px 24px;
        touch-action: pan-y;
        overscroll-behavior: contain;
      }
      .kicker {
        font: 600 12px/1 var(--ui);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #8a6a2c;
      }
      .face h2 {
        margin: 8px 0 2px;
        font: 400 clamp(32px, 7.4vw, 46px)/1.1 var(--hand);
        color: #1f2d3d;
      }
      .face .sub {
        margin: 0 0 14px;
        font: 400 clamp(17px, 3.4vw, 21px)/1.3 var(--hand);
        color: #55606c;
      }
      .trait {
        display: grid;
        grid-template-columns: 150px 1fr;
        align-items: center;
        gap: 10px;
        margin: 8px 0;
        font: 400 clamp(17px, 3.4vw, 20px)/1 var(--hand);
      }
      .trait i {
        display: block;
        height: 14px;
        border-radius: 99px;
        background: rgba(31, 45, 61, 0.14);
        overflow: hidden;
      }
      .trait b {
        display: block;
        height: 100%;
        width: 0;
        border-radius: 99px;
        background: #f2b04c;
        box-shadow: inset 0 0 0 2px #1f2d3d;
        transition: width 1.1s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .note {
        margin-top: 16px;
        padding: 14px 16px;
        border: 2px dashed #1f2d3d;
        border-radius: 14px;
        background: rgba(242, 176, 76, 0.18);
      }
      .note b {
        font: 600 12px/1 var(--ui);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #8a6a2c;
      }
      .note p {
        margin: 8px 0 0;
        font: 400 clamp(19px, 3.6vw, 23px)/1.35 var(--hand);
      }
      .again2 {
        appearance: none;
        display: block;
        margin: 18px auto 0;
        border: 3px solid #1f2d3d;
        background: #f2b04c;
        color: #1f2d3d;
        border-radius: 999px;
        padding: 12px 26px;
        min-height: 48px;
        font: 600 16px/1 var(--ui);
        cursor: pointer;
        transition: transform 0.2s ease;
      }
      .again2:hover {
        transform: translateY(-2px);
      }
      .again2:focus-visible {
        outline: 2px solid #1f2d3d;
        outline-offset: 3px;
      }
      @media (prefers-reduced-motion: reduce) {
        .flip,
        .trait b,
        .reveal {
          transition-duration: 0.01s;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .stage.tapping .fg {
          animation: none;
        }
        .intro {
          animation-duration: 0.4s;
        }
      }
    </style>
  </head>
  <body>
    <main class="stage in-gate" id="stage">
      <svg
        id="world"
        viewBox="0 0 1600 1000"
        preserveAspectRatio="xMidYMid slice"
        role="img"
        aria-label="Suasana kelas dari belakang seorang murid yang menghadap papan tulis"
      >
        <defs>
          <linearGradient id="ceilG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#bdb6a1" />
            <stop offset="1" stop-color="#d8d1bd" />
          </linearGradient>
          <linearGradient id="coveG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#000" stop-opacity=".22" />
            <stop offset="1" stop-color="#000" stop-opacity="0" />
          </linearGradient>
          <linearGradient id="wallG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f1e9d3" />
            <stop offset="1" stop-color="#e2d9be" />
          </linearGradient>
          <linearGradient id="dadoG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#a8c1ae" />
            <stop offset="1" stop-color="#8fab98" />
          </linearGradient>
          <linearGradient id="floorG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#d2cab7" />
            <stop offset="1" stop-color="#9b9380" />
          </linearGradient>
          <linearGradient id="floorShade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#000" stop-opacity="0" />
            <stop offset="1" stop-color="#000" stop-opacity=".35" />
          </linearGradient>
          <linearGradient id="boardG" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#fcfcf9" />
            <stop offset="1" stop-color="#e4e6e1" />
          </linearGradient>
          <linearGradient id="deskG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#dcba88" />
            <stop offset="1" stop-color="#bf9862" />
          </linearGradient>
          <linearGradient id="shirtShade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff" stop-opacity="0" />
            <stop offset="1" stop-color="#5a6e8c" stop-opacity=".26" />
          </linearGradient>
          <linearGradient id="foldG" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#000" stop-opacity="0" />
            <stop offset=".5" stop-color="#000" stop-opacity=".22" />
            <stop offset="1" stop-color="#000" stop-opacity="0" />
          </linearGradient>
          <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#6ec3f4" />
            <stop offset="1" stop-color="#e3f5fd" />
          </linearGradient>
          <radialGradient id="sunG">
            <stop offset="0" stop-color="#fff" stop-opacity=".95" />
            <stop offset="1" stop-color="#fff" stop-opacity="0" />
          </radialGradient>
          <linearGradient
            id="beamG"
            gradientUnits="userSpaceOnUse"
            x1="330"
            y1="300"
            x2="760"
            y2="620"
          >
            <stop offset="0" stop-color="#fff6cf" stop-opacity=".34" />
            <stop offset="1" stop-color="#fff6cf" stop-opacity="0" />
          </linearGradient>
          <clipPath id="winClip">
            <rect x="96" y="156" width="228" height="288" />
          </clipPath>

          <!-- meja murid (titik asal = pusat kepala murid) -->
          <g id="deskShape">
            <polygon
              points="-380,-90 380,-90 480,100 -480,100"
              fill="url(#deskG)"
            />
            <path
              d="M-300 -58 L300 -58 M-350 -8 L350 -8 M-410 44 L410 44"
              stroke="#8f6a3e"
              stroke-opacity=".13"
              stroke-width="3"
              fill="none"
            />
            <polygon
              points="-380,-90 380,-90 480,100 -480,100"
              fill="none"
              stroke="#a98154"
              stroke-width="3"
            />
            <line
              x1="-380"
              y1="-88"
              x2="380"
              y2="-88"
              stroke="#f3e0b9"
              stroke-width="3"
            />
          </g>

          <!-- badan murid dari belakang -->
          <g id="kidBody">
            <path
              d="M-300 330 C-300 200 -215 112 -82 96 L82 96 C215 112 300 200 300 330 Z"
              fill="#f3f5f8"
            />
            <path
              d="M-300 330 C-300 200 -215 112 -82 96 L82 96 C215 112 300 200 300 330 Z"
              fill="url(#shirtShade)"
            />
            <path
              d="M-130 190 Q-96 232 -118 270 M130 190 Q96 232 118 270 M0 134 L0 258"
              stroke="#8d9aa8"
              stroke-opacity=".3"
              stroke-width="3"
              fill="none"
              stroke-linecap="round"
            />
            <rect x="-300" y="258" width="600" height="72" fill="#767c84" />
            <rect x="-300" y="254" width="600" height="8" fill="#4b5058" />
          </g>
          <g id="chair">
            <rect x="-212" y="372" width="18" height="150" fill="#5b3b23" />
            <rect x="194" y="372" width="18" height="150" fill="#5b3b23" />
            <rect
              x="-250"
              y="318"
              width="500"
              height="64"
              rx="22"
              fill="#9a6238"
            />
            <rect
              x="-236"
              y="326"
              width="472"
              height="8"
              rx="4"
              fill="#c18a5c"
              opacity=".7"
            />
          </g>
          <g id="kidBoy">
            <use href="#kidBody" />
            <use href="#chair" />
            <rect
              x="-27"
              y="50"
              width="54"
              height="58"
              rx="10"
              style="fill: var(--skin, #c08a5b)"
            />
            <path
              d="M-52 92 Q0 126 52 92 L66 108 Q0 146 -66 108 Z"
              fill="#fff"
              stroke="#cfd6de"
              stroke-width="2"
            />
            <ellipse
              cx="-69"
              cy="16"
              rx="11"
              ry="17"
              style="fill: var(--skin, #c08a5b)"
            />
            <ellipse
              cx="69"
              cy="16"
              rx="11"
              ry="17"
              style="fill: var(--skin, #c08a5b)"
            />
            <path
              d="M-69 8 C-74 -52 -40 -80 0 -80 C40 -80 74 -52 69 8 C68 38 54 56 40 62 Q0 76 -40 62 C-54 56 -68 38 -69 8 Z"
              style="fill: var(--hair, #16171c)"
            />
            <ellipse
              cx="-22"
              cy="-48"
              rx="26"
              ry="12"
              fill="#fff"
              opacity=".07"
            />
          </g>
          <g id="kidGirl">
            <use href="#kidBody" />
            <use href="#chair" />
            <path
              d="M-92 6 C-98 -70 -48 -98 0 -98 C48 -98 98 -70 92 6 C94 56 150 84 176 150 C140 200 80 222 0 222 C-80 222 -140 200 -176 150 C-150 84 -94 56 -92 6 Z"
              fill="#fbfbfc"
              stroke="#cdd3db"
              stroke-width="3"
            />
            <path
              d="M-60 100 Q-30 160 -50 210 M60 100 Q30 160 50 210 M0 -90 Q-6 -20 0 60"
              stroke="#cdd3db"
              stroke-opacity=".8"
              stroke-width="2.5"
              fill="none"
              stroke-linecap="round"
            />
          </g>
        </defs>

        <!-- ================= LATAR KELAS ================= -->
        <g id="room">
          <rect
            x="-400"
            y="-1600"
            width="2400"
            height="1480"
            fill="url(#ceilG)"
          />
          <rect
            x="460"
            y="-330"
            width="260"
            height="14"
            rx="6"
            fill="#fffef2"
          />
          <rect
            x="880"
            y="-330"
            width="260"
            height="14"
            rx="6"
            fill="#fffef2"
          />

              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="intro"></div>
    </main>

    <script>
      (() => {
        "use strict";
        const $ = (id) => document.getElementById(id);
        const svg = $("world"),
          gsvg = $("gate"),
          stage = $("stage");
        const lerp = (a, b, t) => a + (b - a) * t;
        const easeIO = (t) =>
          t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        const easeO = (t) => 1 - Math.pow(1 - t, 3);
        const lin = (t) => t;
        const reduce =
          window.matchMedia &&
          matchMedia("(prefers-reduced-motion: reduce)").matches;

        /* ---------- kamera ---------- */
        // w,h = area minimum yang harus terlihat; sisanya mengikuti rasio layar
        const CAM = {
          intro: { cx: 800, cy: 420, w: 1080, h: 930 },
          board: { cx: 800, cy: 462, w: 900, h: 780 },
          book: { cx: 915, cy: 655, w: 440, h: 280 },
          bookIn: { cx: 932, cy: 668, w: 400, h: 255 },
          clock: { cx: 1372, cy: 256, w: 400, h: 260 },
          window: { cx: 212, cy: 300, w: 440, h: 340 },
          windowIn: { cx: 222, cy: 300, w: 380, h: 293 },
          deliver: { cx: 800, cy: 610, w: 760, h: 560 },
          gateWide: { cx: 800, cy: 600, w: 1500, h: 800 },
          gateMid: { cx: 800, cy: 610, w: 1180, h: 700 },
          gateAsk: { cx: 800, cy: 735, w: 1180, h: 700 },
          gateTell: { cx: 790, cy: 610, w: 980, h: 640 },
          gateClimb: { cx: 1010, cy: 575, w: 1240, h: 720 },
          gateBack: { cx: 1440, cy: 620, w: 1000, h: 640 },
          paper: { cx: 930, cy: 676, w: 430, h: 290 },
          friend: { cx: 1450, cy: 650, w: 300, h: 200 },
          corridor: { cx: 500, cy: 560, w: 1100, h: 640 },
          wallet: { cx: 1390, cy: 755, w: 760, h: 480 },
          room: { cx: 800, cy: 650, w: 1300, h: 760 },
          deskCard: { cx: 810, cy: 600, w: 600, h: 380 },
        };
        const cam = { ...CAM.intro };
        let par = 0; // 0 = di belakang murid, 1 = melewati bahu menuju meja
        let aspect = 1.6,
          token = 0,
          state = "intro";

        function measure() {
          const r = stage.getBoundingClientRect();
          aspect = Math.max(0.2, r.width / Math.max(1, r.height));
        }
        addEventListener("resize", measure);
        measure();

        function renderCam(t) {
          const visW = Math.max(cam.w, cam.h * aspect),
            visH = visW / aspect,
            k = visW / 1000;
          const sx = reduce ? 0 : Math.sin(t * 0.55) * 4 * k,
            sy = reduce ? 0 : Math.cos(t * 0.43) * 3 * k;
          (stage.classList.contains("in-gate") ? gsvg : svg).setAttribute(
            "viewBox",
            `${cam.cx + sx - visW / 2} ${cam.cy + sy - visH / 2} ${visW} ${visH}`,
          );
        }

        /* ---------- tween & waktu ---------- */
        function tween(dur, fn, ease = easeIO) {
          const my = token;
          return new Promise((res) => {
            const t0 = performance.now();
            (function step() {
              if (my !== token) {
                res(false);
                return;
              }
              const k = Math.min(1, (performance.now() - t0) / (dur * 1000));
              fn(ease(k), k);
              if (k < 1) requestAnimationFrame(step);
              else res(true);
            })();
          });
        }
        function wait(s) {
          const my = token;
          return new Promise((r) =>
            setTimeout(() => r(my === token), s * 1000),
          );
        }

        let camJob = 0;
        function camTo(target, parTarget, dur, ease = easeIO) {
          const c0 = { ...cam },
            p0 = par,
            job = ++camJob;
          return tween(
            dur,
            (e) => {
              if (job !== camJob) return;
              cam.cx = lerp(c0.cx, target.cx, e);
              cam.cy = lerp(c0.cy, target.cy, e);
              cam.w = c0.w * Math.pow(target.w / c0.w, e);
              cam.h = c0.h * Math.pow(target.h / c0.h, e);
              par = lerp(p0, parTarget, e);
              renderParallax();
            },
            ease,
          );
        }

        /* ---------- jam dinding ---------- */
        const clock = { sec: 0, f: 1 };
        const hHand = $("hHand"),
          mHand = $("mHand"),
          sHand = $("sHand");
        (function ticks() {
          let s = "";
          for (let i = 0; i < 12; i++) {
            s += `<line x1="1372" y1="196" x2="1372" y2="${i % 3 === 0 ? 206 : 203}" transform="rotate(${i * 30} 1372 256)"/>`;
          }
          $("ticks").innerHTML = s;
        })();
        function renderClock() {
          const s = clock.sec % 60,
            mins = 50 + clock.sec / 60;
          sHand.setAttribute("transform", `rotate(${s * 6} 1372 256)`);
          mHand.setAttribute(
            "transform",
            `rotate(${(mins * 6) % 360} 1372 256)`,
          );
          hHand.setAttribute(
            "transform",
            `rotate(${((1 + mins / 60) % 12) * 30} 1372 256)`,
          );
        }

        /* ---------- lantai ---------- */
        (function floor() {
          let s = "";
          for (let k = -14; k <= 14; k++) {
            const x0 = 800 + k * 130,
              x1 = 800 + ((x0 - 800) * (2200 - 300)) / (720 - 300);
            s += `<line x1="${x0}" y1="720" x2="${x1.toFixed(0)}" y2="2200"/>`;
          }
          for (
            let n = 0, y = 740;
            y < 2200;
            n++, y = 720 + 34 * Math.pow(1.32, n)
          ) {
            s += `<line x1="-400" y1="${y.toFixed(0)}" x2="2000" y2="${y.toFixed(0)}"/>`;
          }
          $("floorLines").innerHTML = s;
        })();

        /* ---------- tulisan tangan ---------- */
        const inkG = $("ink"),
          NS = "http://www.w3.org/2000/svg";
        const INK_FONT =
          "'Patrick Hand','Segoe Print','Bradley Hand','Comic Sans MS',cursive";
        function makeInk(group, texts, x, ys, maxW, size, tag) {
          const lines = texts.map((str, i) => {
            const id = tag + i;
            const cp = document.createElementNS(NS, "clipPath");
            cp.setAttribute("id", id);
            const r = document.createElementNS(NS, "rect");
            r.setAttribute("x", x - 3);
            r.setAttribute("y", ys[i] - 24);
            r.setAttribute("height", 34);
            r.setAttribute("width", 0);
            cp.appendChild(r);
            svg.querySelector("defs").appendChild(cp);
            const t = document.createElementNS(NS, "text");
            t.setAttribute("x", x);
            t.setAttribute("y", ys[i]);
            t.setAttribute("font-family", INK_FONT);
            t.setAttribute("font-size", size);
            t.setAttribute("fill", "#1f3fa8");
            t.setAttribute("stroke", "none");
            t.setAttribute("clip-path", `url(#${id})`);
            t.textContent = str;
            group.appendChild(t);
            return { t, r, x, y: ys[i], w: 0 };
          });
          lines.maxW = maxW;
          lines.size = size;
          return lines;
        }
        function measureLines(lines) {
          lines.forEach((l) => {
            l.t.setAttribute("font-size", lines.size);
            let w = l.t.getComputedTextLength();
            if (w > lines.maxW) {
              l.t.setAttribute(
                "font-size",
                ((lines.size * lines.maxW) / w).toFixed(2),
              );
              w = lines.maxW;
            }
            l.w = w;
          });
        }
        const inkLines = makeInk(
          inkG,
          ["Developer by", "Ali Ibnu Jabir", "and", "Rizky Saputra", "Dinata"],
          952,
          [637, 657, 677, 697, 717],
          140,
          17,
          "inkClip",
        );
        function resetInk() {
          inkLines.forEach((l) => l.r.setAttribute("width", 0));
          inkG.removeAttribute("style");
          inkG.setAttribute("opacity", 0.92);
        }

        /* ---------- lengan & tangan ---------- */
        const E_L = { x: 500, y: 885 },
          H_L = { x: 688, y: 694 };
        const E_R = { x: 1100, y: 885 };
        const R0 = { hx: 1020, hy: 745, fx: 1004, fy: 727 };
        const PEN0 = { tx: 1136, ty: 696, dx: 70, dy: -24 };
        const R = { ...R0 },
          pen = { ...PEN0 };
        const el = {};
        [
          "foreLo",
          "foreLi",
          "foreRo",
          "foreRi",
          "handR",
          "fingR",
          "handShadow",
          "penShadow",
          "penBody",
          "penBand",
          "penTip",
          "sleeves",
          "studentBody",
        ].forEach((id) => (el[id] = $(id)));

        function extend(E, H, amt) {
          const dx = E.x - H.x,
            dy = E.y - H.y,
            l = Math.hypot(dx, dy) || 1;
          return { x: E.x + (dx / l) * amt, y: E.y + (dy / l) * amt };
        }
        function setLine(a, b, x1, y1, x2, y2) {
          [a, b].forEach((n) => {
            n.setAttribute("x1", x1);
            n.setAttribute("y1", y1);
            n.setAttribute("x2", x2);
            n.setAttribute("y2", y2);
          });
        }
        function drawArms() {
          const ext = 720 * par;
          const a = extend(E_L, H_L, ext);
          setLine(el.foreLo, el.foreLi, a.x, a.y, H_L.x, H_L.y);
          const b = extend(E_R, { x: R.hx, y: R.hy }, ext);
          setLine(el.foreRo, el.foreRi, b.x, b.y, R.hx, R.hy);

          el.handR.setAttribute("cx", R.hx);
          el.handR.setAttribute("cy", R.hy);
          el.fingR.setAttribute("cx", R.fx);
          el.fingR.setAttribute("cy", R.fy);
          el.handShadow.setAttribute("cx", R.hx + 10);
          el.handShadow.setAttribute("cy", R.hy + 14);

          const x2 = pen.tx + pen.dx,
            y2 = pen.ty + pen.dy;
          el.penBody.setAttribute("x1", pen.tx + pen.dx * 0.12);
          el.penBody.setAttribute("y1", pen.ty + pen.dy * 0.12);
          el.penBody.setAttribute("x2", x2);
          el.penBody.setAttribute("y2", y2);
          el.penShadow.setAttribute("x1", pen.tx + 3);
          el.penShadow.setAttribute("y1", pen.ty + 5);
          el.penShadow.setAttribute("x2", x2 + 3);
          el.penShadow.setAttribute("y2", y2 + 5);
          el.penTip.setAttribute("x1", pen.tx);
          el.penTip.setAttribute("y1", pen.ty);
          el.penTip.setAttribute("x2", pen.tx + pen.dx * 0.15);
          el.penTip.setAttribute("y2", pen.ty + pen.dy * 0.15);
          el.penBand.setAttribute("x1", pen.tx + pen.dx * 0.8);
          el.penBand.setAttribute("y1", pen.ty + pen.dy * 0.8);
          el.penBand.setAttribute("x2", pen.tx + pen.dx * 0.84);
          el.penBand.setAttribute("y2", pen.ty + pen.dy * 0.84);
        }
        function renderParallax() {
          const t = `translate(0 ${(par * 420).toFixed(1)})`;
          el.studentBody.setAttribute("transform", t);
          el.sleeves.setAttribute("transform", t);
          drawArms();
        }

        /* ---------- UI helpers ---------- */
        const choicesEl = $("choices"),
          captionEl = $("caption");
        const showChoices = () => choicesEl.classList.add("show");
        const hideChoices = () => choicesEl.classList.remove("show");
        function caption(txt) {
          captionEl.textContent = txt;
          captionEl.classList.add("show");
        }
        function hideCaption() {
          captionEl.classList.remove("show");
        }
        function begin() {
          token++;
          state = "scene";
          hideChoices();
          hideCaption();
          stage.classList.add("cinema");
          if (document.activeElement) document.activeElement.blur();
        }

        /* ---------- SCENE 2A: kerjakan sekarang ---------- */
        async function writing(lines = inkLines) {
          // jangkau pulpen
          const P = { x: pen.tx + pen.dx * 0.5, y: pen.ty + pen.dy * 0.5 };
          const hs = { x: R.hx, y: R.hy },
            hr = { x: P.x + 16, y: P.y + 18 };
          if (
            !(await tween(1, (e) => {
              R.hx = lerp(hs.x, hr.x, e);
              R.hy = lerp(hs.y, hr.y, e);
              R.fx = R.hx - 16;
              R.fy = R.hy - 18;
              drawArms();
            }))
          )
            return;
          if (!(await wait(0.2))) return;

          // ambil pulpen & angkat ke baris pertama
          const T0 = { x: pen.tx, y: pen.ty },
            D0 = { x: pen.dx, y: pen.dy };
          measureLines(lines);
          const T1 = { x: lines[0].x, y: lines[0].y - 2 },
            D1 = { x: 30, y: 72 };
          if (
            !(await tween(1.1, (e) => {
              pen.tx = lerp(T0.x, T1.x, e);
              pen.ty = lerp(T0.y, T1.y, e) - 20 * Math.sin(Math.PI * e);
              pen.dx = lerp(D0.x, D1.x, e);
              pen.dy = lerp(D0.y, D1.y, e);
              const k = lerp(0.5, 0.85, e),
                ox = lerp(16, 0, e),
                oy = lerp(18, 0, e),
                fk = lerp(0.5, 0.45, e);
              R.hx = pen.tx + pen.dx * k + ox;
              R.hy = pen.ty + pen.dy * k + oy;
              R.fx = pen.tx + pen.dx * fk;
              R.fy = pen.ty + pen.dy * fk;
              drawArms();
            }))
          )
            return;

          const setTip = (x, y) => {
            pen.tx = x;
            pen.ty = y;
            R.hx = x + pen.dx * 0.85;
            R.hy = y + pen.dy * 0.85;
            R.fx = x + pen.dx * 0.45;
            R.fy = y + pen.dy * 0.45;
            drawArms();
          };
          for (let i = 0; i < lines.length; i++) {
            const l = lines[i];
            if (i > 0) {
              const a = { x: pen.tx, y: pen.ty },
                b = { x: l.x, y: l.y - 2 };
              if (
                !(await tween(0.28, (e) =>
                  setTip(
                    lerp(a.x, b.x, e),
                    lerp(a.y, b.y, e) - 8 * Math.sin(Math.PI * e),
                  ),
                ))
              )
                return;
            }
            if (
              !(await tween(
                Math.max(0.6, l.w / 70),
                (e) => {
                  const x = l.x + e * l.w;
                  l.r.setAttribute("width", e * l.w + 3 + (e >= 1 ? 8 : 0));
                  setTip(x, l.y - 2 - 3 * Math.abs(Math.sin(x * 0.7)));
                },
                lin,
              ))
            )
              return;
          }
          // angkat pulpen sedikit setelah selesai
          const a = { x: pen.tx, y: pen.ty };
          return await tween(
            0.6,
            (e) => setTip(a.x + 6 * e, a.y - 10 * e),
            easeO,
          );
        }
        /* ---------- mengantar tugas ke meja guru ---------- */
        const bookWrap = $("bookWrap"),
          handLg = $("handLg");
        const BOOK_C = { x: 915, y: 680 },
          DESK_C = { x: 800, y: 528 },
          BOOK_S = 0.3;
        const HL0 = { x: H_L.x, y: H_L.y };
        let bookU = 0;
        function bookPose(u, lift) {
          return {
            s: lerp(1, BOOK_S, u),
            x: lerp(BOOK_C.x, DESK_C.x, u),
            y:
              lerp(BOOK_C.y, DESK_C.y, u) - (lift || 0) * Math.sin(Math.PI * u),
          };
        }
        const bookPt = (q, p) => ({
          x: q.x + q.s * (p.x - BOOK_C.x),
          y: q.y + q.s * (p.y - BOOK_C.y),
        });
        function setBook(u, lift) {
          bookU = u;
          if (u === 0) {
            bookWrap.removeAttribute("transform");
            return;
          }
          const q = bookPose(u, lift);
          bookWrap.setAttribute(
            "transform",
            `translate(${q.x.toFixed(1)} ${q.y.toFixed(1)}) scale(${q.s.toFixed(3)}) translate(${-BOOK_C.x} ${-BOOK_C.y})`,
          );
        }
        function setLeft(x, y) {
          H_L.x = x;
          H_L.y = y;
          handLg.setAttribute(
            "transform",
            `translate(${x - HL0.x} ${y - HL0.y})`,
          );
        }
        async function deliver() {
          const R1 = { ...R },
            P1 = { ...pen },
            L1 = { x: H_L.x, y: H_L.y };
          const oPen = { x: P1.tx - R1.hx, y: P1.ty - R1.hy },
            oF = { x: R1.fx - R1.hx, y: R1.fy - R1.hy };
          const rPt = { x: 1092, y: 744 },
            lPt = { x: 712, y: 736 };
          const setHands = (rx, ry, lx, ly) => {
            R.hx = rx;
            R.hy = ry;
            R.fx = rx + oF.x;
            R.fy = ry + oF.y;
            pen.tx = rx + oPen.x;
            pen.ty = ry + oPen.y;
            setLeft(lx, ly);
            drawArms();
          };
          hideCaption();
          camTo(CAM.deliver, 1, 1.8);
          // 1) tangan memegang buku
          if (
            !(await tween(0.9, (e) =>
              setHands(
                lerp(R1.hx, rPt.x, e),
                lerp(R1.hy, rPt.y, e),
                lerp(L1.x, lPt.x, e),
                lerp(L1.y, lPt.y, e),
              ),
            ))
          )
            return;
          caption("Selesai! Saatnya dikumpulkan.");
          $("studentBody").after(bookWrap); // buku tampil di atas badan murid
          if (!(await wait(0.5))) return;
          // 2) buku dibawa ke meja guru
          if (
            !(await tween(2.4, (e) => {
              setBook(e, 120);
              const q = bookPose(e, 120),
                a = bookPt(q, rPt),
                b = bookPt(q, lPt);
              setHands(a.x, a.y, b.x, b.y);
            }))
          )
            return;
          setBook(1);
          hideCaption();
          if (!(await wait(0.5))) return;
          caption("Tugas sudah dikumpulkan ke guru.");
          // 3) tangan kembali
          const Re = { ...R },
            Pe = { ...pen },
            Le = { x: H_L.x, y: H_L.y };
          return await tween(1.2, (e) => {
            R.hx = lerp(Re.hx, R0.hx, e);
            R.hy = lerp(Re.hy, R0.hy, e);
            R.fx = lerp(Re.fx, R0.fx, e);
            R.fy = lerp(Re.fy, R0.fy, e);
            ["tx", "ty", "dx", "dy"].forEach(
              (k) => (pen[k] = lerp(Pe[k], PEN0[k], e)),
            );
            setLeft(lerp(Le.x, HL0.x, e), lerp(Le.y, HL0.y, e));
            drawArms();
          });
        }
        async function sceneNow() {
          begin();
          if (!(await camTo(CAM.book, 1, 2.4))) return;
          caption("Gas, tugas harus selesai!");
          camTo(CAM.bookIn, 1, 12, lin);
          if (!(await writing())) return;
          if (!(await deliver())) return;
          award("kelas", "now");
          toExam();
        }

        /* ---------- SCENE 2B: nanti saja ---------- */
        async function sceneLater() {
          begin();
          if (!(await camTo(CAM.clock, 0, 2.1))) return;
          caption("Masih ada waktu... katanya.");
          stage.classList.add("dusk-on");
          if (!(await tween(0.9, (e) => (clock.f = lerp(1, 160, e))))) return;
          if (!(await wait(2.6))) return;
          tween(0.7, (e) => (clock.f = lerp(160, 1, e)));
          if (!(await camTo(CAM.book, 1, 2.3))) return;
          stage.classList.add("tapping");
          camTo(CAM.bookIn, 1, 14, lin);
          if (!(await wait(7))) return;
          award("kelas", "later");
          toExam();
        }

        /* ---------- SCENE 2C: tidak dikerjakan ---------- */
        async function sceneSkip() {
          begin();
          if (!(await camTo(CAM.book, 1, 2.2))) return;
          if (!(await wait(1.5))) return;
          if (!(await camTo(CAM.window, 1, 2.3))) return;
          caption("Besok urusan besok.");
          camTo(CAM.windowIn, 1, 14, lin);
          if (!(await wait(6))) return;
          award("kelas", "skip");
          toExam();
        }

        /* ---------- SCENE 0: gerbang sekolah ---------- */
        const gateChEl = $("gateChoices"),
          fadeEl = $("fade"),
          cardEl = $("card");
        const LEAF_OPEN = 991.5,
          LEAF_SHUT = 640;
        const leafEl = $("leaf"),
          doorEl = $("doorLeaf");
        (function buildGate() {
          let f = "";
          for (let x = -560; x < 1380; x += 34) {
            if (x > 570 && x < 1010) continue;
            f += `<rect x="${x}" y="486" width="9" height="160" fill="#1f2d3d"/><polygon points="${x},486 ${x + 4.5},470 ${x + 9},486" fill="#1f2d3d"/>`;
          }
          f += `<rect x="-800" y="500" width="1396" height="12" fill="#1f2d3d"/><rect x="-800" y="626" width="1396" height="12" fill="#1f2d3d"/>`;
          f += `<rect x="1006" y="500" width="374" height="12" fill="#1f2d3d"/><rect x="1006" y="626" width="374" height="12" fill="#1f2d3d"/>`;
          $("fenceBars").innerHTML = f;
          let l = "";
          for (let k = 0; k < 9; k++) {
            const x = 12.5 + k * 34;
            l += `<rect x="${x}" y="486" width="9" height="196" fill="#1f2d3d"/><polygon points="${x},486 ${x + 4.5},470 ${x + 9},486" fill="#1f2d3d"/>`;
          }
          l += `<rect x="0" y="500" width="322" height="12" fill="#1f2d3d"/><rect x="0" y="626" width="322" height="12" fill="#1f2d3d"/><rect x="0" y="682" width="322" height="12" fill="#1f2d3d"/>`;
          l += `<rect x="2" y="560" width="22" height="30" rx="5" fill="#f2b04c" stroke="#1f2d3d" stroke-width="3"/>`;
          leafEl.innerHTML = l;
        })();
        const setLeaf = (x) =>
          leafEl.setAttribute("transform", `translate(${x.toFixed(1)} 0)`);
        const setDoor = (k) =>
          doorEl.setAttribute(
            "transform",
            `translate(1470 0) scale(${k.toFixed(3)} 1) translate(-1470 0)`,
          );

        const SVGNS = "http://www.w3.org/2000/svg";
        const figure = (p) => {
          const f = {
            g: $(p + "G"),
            la: $(p + "LegA"),
            lb: $(p + "LegB"),
            aa: $(p + "ArmA"),
            ab: $(p + "ArmB"),
            up: $(p + "Up"),
          };
          if (f.up)
            f.legs = [f.la, f.lb].map((g) => {
              const mk = (tag, o) => {
                const e = document.createElementNS(SVGNS, tag);
                Object.entries(o).forEach(([k, v]) => e.setAttribute(k, v));
                return e;
              };
              const ln = {
                stroke: "#1f2d3d",
                "stroke-width": 14,
                "stroke-linecap": "round",
              };
              const grp = mk("g", {}),
                th = mk("line", ln),
                sh = mk("line", ln),
                shoe = mk("rect", {
                  width: 23,
                  height: 10,
                  rx: 4,
                  y: -9,
                  fill: "#1f2d3d",
                });
              grp.style.display = "none";
              grp.append(th, sh, shoe);
              const orig = [...g.children];
              g.append(grp);
              return { g, orig, grp, th, sh, shoe };
            });
          return f;
        };
        function standUp(f) {
          f.up.removeAttribute("transform");
          f.legs.forEach((l) => {
            l.grp.style.display = "none";
            l.orig.forEach((c) => (c.style.display = ""));
          });
        }
        const guard = figure("guard"),
          kid = figure("kid");
        const rotAt = (n, a, y = 0) =>
          n.setAttribute("transform", `rotate(${a.toFixed(1)} 0 ${y})`);
        function place(f, x, y, s, face, rot) {
          const r = rot ? (face === "R" ? rot : -rot) : 0; // rot = condong ke depan (derajat)
          f.g.setAttribute(
            "transform",
            `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${r.toFixed(1)}) scale(${(face === "R" ? -s : s).toFixed(3)} ${s.toFixed(3)})`,
          );
        }
        function walkPose(f, ph, leg = 34, arm = 36) {
          if (f.up) standUp(f);
          const a = Math.sin(ph);
          rotAt(f.la, a * leg, -64);
          rotAt(f.lb, -a * leg, -64);
          rotAt(f.aa, -a * arm);
          rotAt(f.ab, a * arm);
        }
        function idlePose(f, t = 0) {
          if (f.up) standUp(f);
          rotAt(f.la, 0, -64);
          rotAt(f.lb, 0, -64);
          rotAt(f.aa, 4 + Math.sin(t) * 2);
          rotAt(f.ab, -4 - Math.sin(t) * 2);
        }
        const kidOpacity = (v) => kid.g.setAttribute("opacity", v.toFixed(2));
        const fadeOut = (e) => (e > 0.75 ? 1 - (e - 0.75) / 0.25 : 1);
        const clamp01 = (v) => Math.max(0, Math.min(1, v));

          const labels = [

            if (i === 4) continue; // slot ini diganti tangga
            const x = -300 + i * 420;
            c += `<rect x="${x + 110}" y="180" width="180" height="14" fill="#f2b04c"/>`;
            c += `<rect x="${x + 40}" y="440" width="124" height="304" fill="#1f2d3d"/>`;
            c += `<rect x="${x + 62}" y="470" width="80" height="78" fill="#f2b04c" stroke="#f6efdc" stroke-width="3"/>`;
            c += `<circle cx="${x + 148}" cy="610" r="6" fill="#f2b04c"/>`;
            c += `<rect x="${x + 34}" y="392" width="136" height="34" fill="#f2b04c" stroke="#1f2d3d" stroke-width="3"/>`;
            c += `<text x="${x + 102}" y="417" text-anchor="middle" font-size="22" fill="#1f2d3d" font-family="${HAND}">${labels[i]}</text>`;
            c += `<rect x="${x + 240}" y="330" width="150" height="190" fill="#f2b04c" stroke="#1f2d3d" stroke-width="5"/>`;
            c += `<line x1="${x + 315}" y1="330" x2="${x + 315}" y2="520" stroke="#1f2d3d" stroke-width="4"/><line x1="${x + 240}" y1="425" x2="${x + 390}" y2="425" stroke="#1f2d3d" stroke-width="4"/>`;
            c += `<rect x="${x + 230}" y="520" width="170" height="14" fill="#1f2d3d"/>`;
          }
          // tangga (naik ke kanan)
          c += `<rect x="1480" y="292" width="200" height="44" rx="6" fill="#f2b04c" stroke="#1f2d3d" stroke-width="4"/>`;
          c += `<text x="1580" y="325" text-anchor="middle" font-size="30" fill="#1f2d3d" font-family="${HAND}">Tangga</text>`;
          for (let k = 0; k < 6; k++) {
            const sx = 1440 + k * 56,
              sy = 728 - (k + 1) * 48;
            c += `<rect x="${sx}" y="${sy}" width="${(6 - k) * 56}" height="${(k + 1) * 48}" fill="#1f2d3d"/>`;
            c += `<rect x="${sx}" y="${sy}" width="56" height="9" fill="#f2b04c"/>`;
            const px = sx + 28,
              ry = 680 - 0.857 * (px - 1440) - 90;
            c += `<line x1="${px}" y1="${sy}" x2="${px}" y2="${ry.toFixed(0)}" stroke="#1f2d3d" stroke-width="5"/>`;
          }
          c += `<line x1="1440" y1="${(680 - 90 + 12).toFixed(0)}" x2="1776" y2="${(680 - 0.857 * 336 - 90 - 12).toFixed(0)}" stroke="#f2b04c" stroke-width="9" stroke-linecap="round"/>`;
          c += `<rect x="-800" y="728" width="4800" height="20" fill="#1f2d3d"/>`;
          c += `<rect x="-800" y="748" width="4800" height="800" fill="#1f2d3d" opacity=".14"/>`;
          for (let x = -800; x < 4000; x += 210)
            c += `<line x1="${x}" y1="748" x2="${x}" y2="1500" stroke="#1f2d3d" stroke-opacity=".12" stroke-width="3"/>`;
          // dompet cokelat di dekat tangga
          c +=
            `<g id="walletG"><g id="walletBillsG"><use href="#walletBills"/></g><use href="#walletBody"/>` +
            `<g id="walletSpark" stroke="#f2b04c" stroke-width="4" stroke-linecap="round" fill="none"><path d="M-58 -64 l-12 -12 M0 -78 v-16 M58 -64 l12 -12"><animate attributeName="opacity" values="1;.15;1" dur="1.6s" repeatCount="indefinite"/></path></g></g>`;
          $("corridorScene").innerHTML = c;
        })();

        /* ---------- POV koridor (sudut pandang orang pertama) ---------- */
        const pov = (() => {
          const cv = document.createElement("canvas");
          cv.style.cssText =
            "position:absolute;inset:0;width:100%;height:100%;z-index:1;display:none";
          stage.insertBefore(cv, stage.querySelector(".dusk"));
          const g = cv.getContext("2d");
          const o = {
            z: 0,
            on: false,
            wallet: null,
            goal: null,
            dusk: false,
            crouch: 0,
            pitch: 0,
            look: 0,
            reach: 0,
            hold: 0,
            bills: 1,
            walletOn: true,
          };
          const HW = 2.1,
            HT = 3.4,
            ZEND = 60,
            EYE = 1.55;
          let W = 0,
            H = 0,
            f = 0,
            vx = 0,
            vy = 0,
            cx = 0,
            ey = EYE,
            cz = 0,
            T = 0;
          const P = (x, y, z) => [
            vx + ((x - cx) * f) / Math.max(0.2, z - cz),
            vy - ((y - ey) * f) / Math.max(0.2, z - cz),
          ];
          const poly = (pts, fill, a = 1) => {
            if (pts.every((p) => p[2] - cz < 0.2)) return;
            g.globalAlpha = a;
            g.fillStyle = fill;
            g.beginPath();
            pts.forEach((p, i) => {
              const q = P(...p);
              i ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1]);
            });
            g.closePath();
            g.fill();
            g.globalAlpha = 1;
          };
          // bidang di dinding kiri/kanan: z1..z2, y1..y2
          const wall = (s, z1, z2, y1, y2, fill, a) =>
            poly(
              [
                [s * HW, y1, z1],
                [s * HW, y1, z2],
                [s * HW, y2, z2],
                [s * HW, y2, z1],
              ],
              fill,
              a,
            );
          const wtext = (s, txt, z1, z2, y1, y2, col) => {
            const a = P(s * HW, y2, z1),
              b = P(s * HW, y2, z2),
              c = P(s * HW, y1, z1);
            const h = c[1] - a[1],
              w = Math.abs(b[0] - a[0]);
            if (h < 5 || z1 - cz < 0.4) return;
            g.save();
            g.font = `${h * 0.62}px "Patrick Hand", cursive`;
            const m = g.measureText(txt).width || 1;
            g.translate((a[0] + b[0]) / 2, (a[1] + c[1]) / 2 + h * 0.2);
            g.scale(Math.min(1.2, w / m), 1);
            g.fillStyle = col;
            g.textAlign = "center";
            g.fillText(txt, 0, 0);
            g.restore();
          };
          const door = (s, z1, z2, tall) => {
            wall(s, z1 - 0.12, z2 + 0.12, 0, tall + 0.1, "#4a2c16");
            wall(s, z1, z2, 0, tall, "#a8642e");
            wall(s, z1 + 0.12, z2 - 0.12, 1.05, 1.9, "#b9773c", 0.8);
            wall(s, z1, z2, tall * 0.5, tall * 0.5 + 0.03, "#5b3519", 0.7);
          };

          function draw(t) {
            if (!o.on) return;
            const d = Math.min(devicePixelRatio || 1, 1.5);
            const w = Math.round(cv.clientWidth * d),
              h = Math.round(cv.clientHeight * d);
            if (w !== W || h !== H) {
              cv.width = W = w;
              cv.height = H = h;
            }
            f = Math.max(H * 0.95, W * 0.6);
            vx = W * (0.5 + o.look);
            vy = H * (0.46 - 0.3 * o.pitch);
            cz = o.z;
            ey =
              EYE -
              0.8 * o.crouch +
              Math.sin(cz * 4.4) * 0.028 * (1 - o.crouch);
            cx = Math.sin(cz * 2.2) * 0.05 + 0.1;
            T = t;
            const dusk = o.dusk;
            g.clearRect(0, 0, W, H);
            // langit-langit & lantai dasar
            g.fillStyle = "#e9e3d2";
            g.fillRect(0, 0, W, H);
            const fl = g.createLinearGradient(0, vy, 0, H);
            fl.addColorStop(0, dusk ? "#f2c58e" : "#f4dfb4");
            fl.addColorStop(1, dusk ? "#b98a5a" : "#c9a577");
            poly(
              [
                [-HW, 0, cz],
                [HW, 0, cz],
                [HW, 0, ZEND],
                [-HW, 0, ZEND],
              ],
              fl,
            );
            // dinding dasar
            const wl = g.createLinearGradient(0, 0, W, 0);
            wl.addColorStop(0, "#d9b657");
            wl.addColorStop(1, "#d9b657");
            wall(-1, cz, ZEND, 0, HT, "#dcbb5c");
            wall(1, cz, ZEND, 0, HT, "#ebcf74");
            // dinding ujung + jendela hijau
            poly(
              [
                [-HW, 0, ZEND],
                [HW, 0, ZEND],
                [HW, HT, ZEND],
                [-HW, HT, ZEND],
              ],
              "#cfae56",
            );
            const wg = g.createLinearGradient(
              0,
              P(0, 2.5, ZEND)[1],
              0,
              P(0, 1, ZEND)[1],
            );
            wg.addColorStop(0, "#fffbe0");
            wg.addColorStop(1, "#8fd08a");
            poly(
              [
                [-1, 1, ZEND],
                [1, 1, ZEND],
                [1, 2.5, ZEND],
                [-1, 2.5, ZEND],
              ],
              wg,
            );
            for (const bx of [-0.34, 0.34])
              poly(
                [
                  [bx - 0.02, 1, ZEND],
                  [bx + 0.02, 1, ZEND],
                  [bx + 0.02, 2.5, ZEND],
                  [bx - 0.02, 2.5, ZEND],
                ],
                "#6d5a2a",
              );
            // lantai: garis ubin, strip gelap, bercak matahari
            const z0 = Math.max(0, Math.floor((cz - 1) / 1.2) * 1.2);
            g.strokeStyle = "rgba(90,60,30,.16)";
            g.lineWidth = Math.max(1, H / 420);
            for (let z = z0; z < Math.min(ZEND, cz + 40); z += 1.2) {
              if (z - cz < 0.25) continue;
              const a = P(-HW, 0, z),
                b = P(HW, 0, z);
              g.beginPath();
              g.moveTo(a[0], a[1]);
              g.lineTo(b[0], b[1]);
              g.stroke();
            }
            for (const sx of [-1, 1])
              poly(
                [
                  [sx * 0.82, 0, cz],
                  [sx * 0.96, 0, cz],
                  [sx * 0.96, 0, ZEND],
                  [sx * 0.82, 0, ZEND],
                ],
                "#403830",
              );
            // langit-langit: balok & lampu
            const bz = Math.floor((cz - 1) / 3.5) * 3.5;
            for (let z = bz + 3.5; z < Math.min(ZEND, cz + 45); z += 3.5) {
              if (z - cz < 0.25) continue;
              poly(
                [
                  [-HW, HT - 0.28, z + 0.35],
                  [HW, HT - 0.28, z + 0.35],
                  [HW, HT - 0.28, z],
                  [-HW, HT - 0.28, z],
                ],
                "#e4dcc8",
              );
              poly(
                [
                  [-HW, HT - 0.28, z],
                  [HW, HT - 0.28, z],
                  [HW, HT, z],
                  [-HW, HT, z],
                ],
                "#d6cfbb",
              );
            }
            for (let z = bz + 5; z < Math.min(ZEND, cz + 45); z += 7) {
              if (z - cz < 0.5) continue;
              const a = P(0.2, HT, z),
                b = P(0.2, HT - 0.35, z),
                s = Math.max(2, (f * 0.04) / (z - cz));
              g.strokeStyle = "#6c6f74";
              g.lineWidth = Math.max(1, s * 0.3);
              g.beginPath();
              g.moveTo(a[0], a[1]);
              g.lineTo(b[0], b[1]);
              g.stroke();
              g.fillStyle = "#fff6c8";
              g.fillRect(b[0] - s, b[1], s * 2, s * 1.4);
            }
            // fitur dinding, dari jauh ke dekat
            const kmax = Math.min(ZEND / 4, Math.ceil((cz + 45) / 4));
            for (let k = kmax; k >= Math.floor(cz / 4) - 1; k--) {
              const a = k * 4;
              if (k % 2 === 0) {
                door(-1, a + 1, a + 2.2, 2.4);
                wall(-1, a + 1.1, a + 2.1, 2.55, 2.8, "#f0c45a");
                wall(-1, a + 2.5, a + 3.3, 1.1, 2, "#f4efe0", 0.9);
                wall(-1, a + 2.6, a + 3.2, 1.3, 1.9, "#d9602f", 0.9);
              } else {
                wall(-1, a + 0.6, a + 3.2, 0.95, 2.55, "#5f4f22");
                const gl = g.createLinearGradient(0, 0, 0, H);
                gl.addColorStop(0, "#fffbe3");
                gl.addColorStop(1, "#cfe8c0");
                wall(-1, a + 0.7, a + 3.1, 1.05, 2.45, gl);
                for (let i = 0; i <= 8; i++)
                  wall(
                    -1,
                    a + 0.7 + i * 0.3,
                    a + 0.74 + i * 0.3,
                    1.05,
                    2.45,
                    "#7a6a3a",
                  );
                wall(-1, a + 0.55, a + 3.25, 0.9, 0.97, "#3d3222");
              }
            }
            const kmax2 = Math.min(ZEND / 3, Math.ceil((cz + 45) / 3));
            for (let k = kmax2; k >= Math.floor(cz / 3) - 1; k--) {
              const a = k * 3;
              if (o.wallet && Math.abs(a + 0.9 - (o.wallet + 2.3)) < 1.2)
                continue;
              wall(1, a + 0.75, a + 2.15, 0, 2.6, "#7a6128", 0.55);
              door(1, a + 1.05, a + 1.95, 2.4);
              wall(1, a + 0.4, a + 1.5, 0.35, 2.75, "#fff0b0", 0.22);
              poly(
                [
                  [HW, 0, a + 0.1],
                  [HW, 0, a + 1.4],
                  [0.15, 0, a + 0.8],
                  [0.15, 0, a - 0.6],
                ],
                "#fff4be",
                0.3,
              );
            }
            if (o.wallet) {
              // tangga di kanan
              const a = o.wallet + 2.3;
              wall(1, a, a + 2.4, 0, 2.7, "#2a2f3a");
              wall(1, a + 0.1, a + 2.3, 2.7, 2.78, "#403830");
              wall(1, a + 0.2, a + 2.2, 2.95, 3.3, "#f0c45a");
              wtext(1, "Tangga", a + 0.3, a + 2.1, 2.95, 3.3, "#3a2c16");
              for (let i = 0; i < 5; i++)
                wall(
                  1,
                  a + 0.2 + i * 0.4,
                  a + 0.5 + i * 0.4,
                  0.15 * i,
                  0.15 * i + 0.1,
                  "#5d6270",
                );
            }
            if (o.goal) {
              // tanda Ruang Guru di kiri
              const a = o.goal;
              wall(-1, a - 0.3, a + 2.8, 2.5, 3.2, "#f0c45a");
              wtext(-1, "Ruang Guru", a - 0.2, a + 2.7, 2.55, 3.15, "#3a2c16");
            }
            // kilau cahaya jendela ujung
            const gg = g.createRadialGradient(vx, vy, 0, vx, vy, H * 0.55);
            gg.addColorStop(0, "rgba(255,252,230,.55)");
            gg.addColorStop(1, "rgba(255,252,230,0)");
            g.fillStyle = gg;
            g.fillRect(0, 0, W, H);
            // pantulan lantai mengilap
            const rf = g.createLinearGradient(0, vy, 0, vy + H * 0.25);
            rf.addColorStop(0, "rgba(255,255,255,.35)");
            rf.addColorStop(1, "rgba(255,255,255,0)");
            poly(
              [
                [-HW, 0, cz + 0.2],
                [HW, 0, cz + 0.2],
                [HW, 0, ZEND],
                [-HW, 0, ZEND],
              ],
              rf,
            );
            // dompet
            o.q = null;
            if (o.wallet && o.walletOn && (o.hold > 0 || o.wallet - cz > 0.5)) {
              let q = P(1.05, 0, o.wallet),
                s = (f * 0.36) / Math.max(0.5, o.wallet - cz);
              const hd = o.hold;
              q = [lerp(q[0], W * 0.5, hd), lerp(q[1], H * 0.8, hd)];
              s = lerp(s, H * 0.34, hd);
              o.q = [q[0], q[1], s];
              if (hd < 1) {
                g.fillStyle = "rgba(0,0,0,.25)";
                g.beginPath();
                g.ellipse(q[0], q[1], s * 0.62, s * 0.14, 0, 0, 7);
                g.fill();
              }
              if (o.bills > 0.02) {
                const u = 1 - o.bills;
                g.globalAlpha = o.bills;
                g.fillStyle = "#88c27a";
                g.fillRect(
                  q[0] - s * 0.3 - u * s * 0.5,
                  q[1] - s * 0.42 - u * s * 0.8,
                  s * 0.5,
                  s * 0.16,
                );
                g.globalAlpha = 1;
              }
              g.fillStyle = "#7a4a25";
              g.strokeStyle = "#3a2210";
              g.lineWidth = Math.max(1, s * 0.05);
              g.beginPath();
              g.roundRect(
                q[0] - s * 0.5,
                q[1] - s * 0.34,
                s,
                s * 0.34,
                s * 0.06,
              );
              g.fill();
              g.stroke();
              g.strokeStyle = "#f2b04c";
              g.lineWidth = Math.max(1.5, s * 0.06);
              g.lineCap = "round";
              g.globalAlpha = (0.55 + 0.45 * Math.sin(T * 4)) * (1 - hd);
              g.beginPath();
              g.moveTo(q[0] - s * 0.65, q[1] - s * 0.55);
              g.lineTo(q[0] - s * 0.8, q[1] - s * 0.7);
              g.moveTo(q[0], q[1] - s * 0.62);
              g.lineTo(q[0], q[1] - s * 0.85);
              g.moveTo(q[0] + s * 0.65, q[1] - s * 0.55);
              g.lineTo(q[0] + s * 0.8, q[1] - s * 0.7);
              g.stroke();
              g.globalAlpha = 1;
            }
            // tangan & lengan POV mengayun
            const sw = Math.sin(cz * 4.4) * H * 0.012;
            for (const s of [-1, 1]) {
              if (s === 1 && o.reach > 0.01) continue;
              const x = W / 2 + s * W * 0.2,
                y = H + sw * -s;
              g.save();
              g.translate(x, y);
              g.rotate(s * -0.18);
              g.fillStyle = "#f4f1ea";
              g.beginPath();
              g.roundRect(-H * 0.06, -H * 0.17, H * 0.12, H * 0.2, H * 0.03);
              g.fill();
              g.fillStyle = "#e0ac7e";
              g.beginPath();
              g.roundRect(-H * 0.05, -H * 0.24, H * 0.1, H * 0.09, H * 0.04);
              g.fill();
              g.restore();
            }
            // tangan kanan meraih / memegang dompet
            if (o.reach > 0.01 && o.q) {
              const sx = W * 0.82,
                sy = H * 1.12;
              const tx = o.q[0] + o.q[2] * 0.3 * o.hold,
                ty = o.q[1] - o.q[2] * 0.1 + o.q[2] * 0.35 * o.hold;
              const ex = lerp(sx, tx, o.reach),
                ey2 = lerp(sy, ty, o.reach);
              const mx = lerp(sx, ex, 0.62),
                my = lerp(sy, ey2, 0.62);
              g.lineCap = "round";
              g.strokeStyle = "#f4f1ea";
              g.lineWidth = H * 0.12;
              g.beginPath();
              g.moveTo(sx, sy);
              g.lineTo(mx, my);
              g.stroke();
              g.strokeStyle = "#e0ac7e";
              g.lineWidth = H * 0.08;
              g.beginPath();
              g.moveTo(mx, my);
              g.lineTo(ex, ey2);
              g.stroke();
              g.fillStyle = "#e0ac7e";
              g.beginPath();
              g.arc(ex, ey2, H * 0.05, 0, 7);
              g.fill();
            }
            // vinyet
            const vg = g.createRadialGradient(
              vx,
              H * 0.45,
              H * 0.45,
              vx,
              H * 0.45,
              Math.max(W, H) * 0.75,
            );
            vg.addColorStop(0, "rgba(0,0,0,0)");
            vg.addColorStop(1, "rgba(0,0,0,.5)");
            g.fillStyle = vg;
            g.fillRect(0, 0, W, H);
          }
          requestAnimationFrame(function loop(t) {
            draw(t / 1000);
            requestAnimationFrame(loop);
          });
          return {
            o,
            show(opt) {
              Object.assign(
                o,
                {
                  z: 0,
                  wallet: null,
                  goal: null,
                  dusk: false,
                  crouch: 0,
                  pitch: 0,
                  look: 0,
                  reach: 0,
                  hold: 0,
                  bills: 1,
                  walletOn: true,
                },
                opt,
                { on: true },
              );
              cv.style.display = "block";
            },
            hide() {
              o.on = false;
              cv.style.display = "none";
            },
            walk(dur, z1) {
              const z0 = o.z;
              return tween(
                dur,
                (e) => {
                  o.z = lerp(z0, z1, e);
                },
                lin,
              );
            },
          };
        })();

        async function toCorridor(kind) {
          fadeEl.classList.add("on");
          hideCaption();
          if (!(await wait(1.1))) return;
          cardEl.innerHTML =
            "Bel istirahat berbunyi.<small>Kamu keluar kelas dan berjalan di koridor.</small>";
          cardEl.classList.add("show");
          if (!(await wait(2.4))) return;
          cardEl.classList.remove("show");
          if (!(await wait(0.8))) return;
          stage.classList.add("in-gate", "cinema");
          $("gateScene").style.display = "none";
          $("corridorScene").style.display = "none";
          pov.show({ wallet: 24 });
          fadeEl.classList.remove("on");
          if (!(await wait(1.2))) return;
          const mutter = {
            own: '"Bagus lahh, aku dapat nilai 100!"',
            peek: '"Aduh... kalau aja tadi aku nggak nyontek, pasti dapat nilai 100."',
            blank:
              '"Yah... kalau tadi aku mau mencoba, pasti nilainya tidak nol."',
          }[kind];
          setTimeout(() => {
            if (state === "corridor") caption(mutter);
          }, 1200);
          state = "corridor";
          if (!(await pov.walk(7, 12))) return;
          hideCaption();
          caption("Koridor mulai sepi...");
          if (!(await pov.walk(5.5, 20.5))) return;
          hideCaption();
          caption("Di dekat tangga ada dompet cokelat tergeletak.");
          if (
            !(await Promise.all([
              pov.walk(2.8, 21.2),
              tween(2.8, (e) => {
                pov.o.pitch = 0.5 * e;
              }),
            ]).then((r) => r.every(Boolean)))
          )
            return;
          if (!(await wait(0.6))) return;
          hideCaption();
          caption("Uang menyembul dari dalamnya. Tidak ada yang melihat.");
          if (!(await wait(2.6))) return;
          hideCaption();
          state = "wallet-ask";
          walletChEl.classList.add("show");
        }

        /* ============ CERITA 4: dompet di koridor ============ */
        const KX = 1246,
          KY = 800,
          KS = 1.25,
          WS = 1.3,
          BEND = { rot: 58, th: 64 };
        const walletEl = $("walletG"),
          billsEl = $("walletBillsG"),
          sparkEl = $("walletSpark"),
          walletChEl = $("walletChoices");

        // posisi ujung tangan murid (lengan A) bila badan condong `rot` dan lengan terayun `th`
        function handAt(x, y, s, face, rot, th) {
          const d = face === "R" ? 1 : -1,
            r = (rot * Math.PI) / 180,
            t = ((th - rot) * Math.PI) / 180;
          return {
            x: x + d * (118 * s * Math.sin(r) + 52 * s * Math.sin(t)),
            y: y - 118 * s * Math.cos(r) + 52 * s * Math.cos(t),
          };
        }
        const HG = handAt(KX, KY, KS, "R", BEND.rot, BEND.th);
        const setWallet = (x, y, s) =>
          walletEl.setAttribute(
            "transform",
            `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${s.toFixed(3)})`,
          );
        setWallet(HG.x, HG.y + 18 * WS, WS);

        /* jongkok: lutut menekuk, pinggul turun & mundur, punggung condong, tangan meraih dompet */
        const SQ = { dx: 95, lean: 48, drop: 40, back: 22, fa: -16, fb: -8 };
        const D2R = Math.PI / 180;
        function sqShoulder(c, x0) {
          const L = SQ.lean * c * D2R,
            hx = SQ.back * c,
            d = SQ.drop * c;
          return {
            L,
            hx,
            d,
            x: x0 + KS * 52 * Math.sin(L) - KS * hx,
            y: KY + KS * (-66 + d - 52 * Math.cos(L)),
          };
        }
        function sqTh(c, x0 = KX + SQ.dx) {
          const sh = sqShoulder(c, x0);
          const t = Math.atan2(HG.x - sh.x, HG.y - sh.y) / D2R;
          return lerp(4, t + SQ.lean * c, c);
        }
        function sqPose(c, th, x0 = KX + SQ.dx) {
          const sh = sqShoulder(c, x0);
          if (th === undefined) th = sqTh(c, x0);
          place(kid, x0, KY, KS, "R");
          const hip = { x: sh.hx, y: -66 + sh.d };
          [SQ.fa, SQ.fb].forEach((fx, i) => {
            const l = kid.legs[i],
              foot = { x: fx * c, y: -4 };
            const vx = foot.x - hip.x,
              vy = foot.y - hip.y,
              D = Math.min(Math.hypot(vx, vy), 61.9);
            const h = Math.sqrt(31 * 31 - (D / 2) * (D / 2));
            const kx = hip.x + vx / 2 - (vy / D) * h,
              ky = hip.y + vy / 2 + (vx / D) * h;
            l.g.removeAttribute("transform");
            l.orig.forEach((e) => (e.style.display = "none"));
            l.grp.style.display = "";
            const set = (n, p) =>
              Object.entries(p).forEach(([k, v]) =>
                n.setAttribute(k, v.toFixed(1)),
              );
            set(l.th, { x1: hip.x, y1: hip.y, x2: kx, y2: ky });
            set(l.sh, { x1: kx, y1: ky, x2: foot.x, y2: foot.y });
            set(l.shoe, { x: foot.x - 14 });
          });
          kid.up.setAttribute(
            "transform",
            `translate(${sh.hx.toFixed(1)} ${sh.d.toFixed(1)}) rotate(${(-SQ.lean * c).toFixed(1)} 0 -66)`,
          );
          rotAt(kid.aa, th);
          rotAt(kid.ab, lerp(-4, 28, c));
          const t = (th - SQ.lean * c) * D2R;
          return {
            x: sh.x + KS * 52 * Math.sin(t),
            y: sh.y + KS * 52 * Math.cos(t),
          };
        }
        function wlPose(c, th, x0) {
          return sqPose(c, th, x0);
        }
        function wlHold(c, s, th) {
          const h = sqPose(c, th);
          setWallet(h.x, h.y + 18 * s, s);
        }
        function stepIn() {
          return tween(
            0.8,
            (e) => {
              const x = lerp(KX, KX + SQ.dx, e);
              place(kid, x, KY, KS, "R");
              walkPose(kid, x * 0.045, 28, 30);
            },
            lin,
          );
        }
        async function walkAway(carry, x0 = KX) {
          camTo({ cx: 850, cy: 560, w: 1100, h: 640 }, 0, 2.6);
          return await tween(
            4.2,
            (e) => {
              const x = lerp(x0, 380, e),
                op = e > 0.72 ? 1 - (e - 0.72) / 0.28 : 1;
              place(kid, x, KY, KS, "L");
              walkPose(kid, x * 0.05, 28, 30);
              kidOpacity(op);
              if (carry) {
                rotAt(kid.aa, 55);
                const h = handAt(x, KY, KS, "L", 0, 55);
                setWallet(h.x, h.y + 16, 0.9);
                walletEl.setAttribute("opacity", op.toFixed(2));
              }
            },
            lin,
          );
        }

          if (!(await tween(1.0, (e) => wlPose(e, lerp(4, 10, e)))))

          if (!(await wait(0.45))) return false;
          if (!(await tween(0.8, (e) => wlPose(1, lerp(10, sqTh(1), e)))))
            return false;
          sparkEl.style.display = "none";
          return await tween(0.4, (e) =>

        /* ---- versi POV: mengambil dompet dari sudut pandang sendiri ---- */
        const both = async (...p) => (await Promise.all(p)).every(Boolean);
        async function povPick() {
          const o = pov.o;
          if (
            !(await both(
              pov.walk(1.1, 22.4),
              tween(1.1, (e) => {
                o.pitch = lerp(0.5, 0.65, e);
              }),
            ))
          )
            return false;
          if (
            !(await tween(0.9, (e) => {
              o.crouch = e;
            }))
          )
            return false;
          return await tween(0.8, (e) => {
            o.reach = e;
          });
        }
        const povLift = () =>
          tween(1.2, (e) => {
            const o = pov.o;
            o.hold = e;
            o.crouch = 1 - e;
            o.pitch = lerp(0.65, 0.25, e);
          });
        const povWalkOff = (z, from) =>
          both(
            pov.walk(4.4, z),
            tween(1, (e) => {
              pov.o.pitch = lerp(from, 0, e);
            }),
          );

        /* ---------- penilaian karakter ---------- */
        const TRAITS = [
          ["disiplin", "Disiplin"],
          ["jujur", "Kejujuran"],
          ["tanggung", "Tanggung Jawab"],
          ["peduli", "Kepedulian"],
        ];
        const NOTES = {
          gate: {
            climb:
              "Pagi tadi Ibu lihat kamu memanjat pagar. Berani, tapi lain kali bicara saja ke Pak Satpam.",
            tell: "Pagi tadi kamu berani mengaku terlambat kepada Pak Satpam. Itu tidak mudah.",

          kelas: {

            later: "Tugasmu hampir saja terlewat karena kamu tunda.",
            skip: "Tugasmu tidak kamu kerjakan sama sekali.",
          },
          ulangan: {
            own: "Di ulangan, kamu menjawab dengan usahamu sendiri.",
            peek: "Di ulangan, kamu menyalin jawaban temanmu.",
            blank: "Di ulangan, kamu menyerah sebelum mencoba.",
          },
          dompet: {
            give: "Dompet cokelat di dekat tangga itu milik Ibu, sengaja Ibu taruh di sana. Kamu menyerahkannya dengan utuh. Terima kasih.",
            take: "Dompet cokelat di dekat tangga itu milik Ibu, sengaja Ibu taruh di sana. Uangnya berkurang, dan Ibu tahu siapa yang lewat.",
            ignore:
              "Dompet cokelat di dekat tangga itu milik Ibu, sengaja Ibu taruh di sana. Kamu melihatnya, tapi memilih pura-pura tidak tahu.",
          },
        };
        const HOMEWORK = {
          disiplin: "PR-mu: lebih tertib mengatur waktu.",
          jujur: "PR-mu: tetap jujur walau tidak ada yang melihat.",
          tanggung: "PR-mu: selesaikan apa yang menjadi tanggung jawabmu.",
          peduli: "PR-mu: lebih peka pada barang dan perasaan orang lain.",
        };
        function traitNorm(k) {
          let lo = 0,
            hi = 0;
          Object.values(POINTS).forEach((g) => {
            const v = Object.values(g).map((o) => o[k] || 0);
            lo += Math.min(...v);
            hi += Math.max(...v);
          });
          return hi === lo ? 0.5 : clamp01((score[k] - lo) / (hi - lo));
        }
        function evaluate() {
          const ks = TRAITS.map((t) => t[0]),
            label = (k) => TRAITS.find((t) => t[0] === k)[1];
          const n = {};
          ks.forEach((k) => (n[k] = traitNorm(k)));
          const hi = ks.filter((k) => n[k] >= 0.7),
            lo = ks.filter((k) => n[k] <= 0.35);
          const top = ks.reduce((a, b) => (n[b] > n[a] ? b : a));
          const bot = ks.reduce((a, b) => (n[b] < n[a] ? b : a));
          let title;
          if (ks.every((k) => n[k] >= 0.75)) title = "Murid Teladan";
          else if (n.jujur <= 0.35)
            title =
              lo.length >= 3
                ? "Si Jago Cari Celah"
                : hi.length >= 2
                  ? "Si Pintar yang Suka Jalan Pintas"
                  : "Si Pencari Jalan Pintas";
          else if (story.dompet === "take")
            title =
              hi.length >= 2
                ? "Si Baik yang Sempat Tergoda"
                : "Si Pencari Jalan Pintas";
          else if (lo.length >= 3) title = "Si Santai Sejati";
          else if (lo.length === 1 && hi.length >= 2)
            title = {
              peduli: "Si Rajin yang Kurang Peka",
              disiplin: "Si Baik yang Sering Terlambat",
              tanggung: "Si Baik yang Suka Menunda",
            }[lo[0]];
          else if (n.jujur >= 0.7 && n.peduli >= 0.7) title = "Penjaga Amanah";
          else if (n.jujur >= 0.7 && n.disiplin >= 0.7) title = "Si Lurus Hati";
          else if (n.tanggung >= 0.7 && n.disiplin >= 0.7)
            title = "Si Andalan Kelas";
          else if (n.tanggung >= 0.7 && n.peduli >= 0.7)
            title = "Si Hati Hangat";
          else if (n[top] < 0.6) title = "Murid yang Sedang Bertumbuh";
          else
            title = {
              disiplin: "Si Tertib",
              jujur: "Si Jujur",
              tanggung: "Si Bertanggung Jawab",
              peduli: "Si Peduli",
            }[top];

          const pr = story.dompet === "take" ? "jujur" : bot;
          const closing = ks.every((k) => n[k] >= 0.75)
            ? "Pertahankan, ya. Ibu bangga padamu."
            : HOMEWORK[pr];
          const note = [
            NOTES.gate[story.gate],
            NOTES.kelas[story.kelas],
            NOTES.ulangan[story.ulangan],
            NOTES.dompet[story.dompet],
            closing,
          ]
            .filter(Boolean)
            .join(" ");
          const sub = ks.every((k) => n[k] >= 0.75)
            ? "Keempat sifatmu sama-sama kuat."
            : "Paling kuat: " +
              label(top) +
              (bot !== top && n[bot] < 0.7
                ? " \u00b7 Perlu dilatih: " + label(bot)
                : "");
          return {
            title,
            sub,
            note,
            bars: TRAITS.map(([k, l]) => ({
              label: l,
              pct: Math.max(6, Math.round(n[k] * 100)),
            })),
          };
        }

          const r = evaluate();

          $("rSub").textContent = r.sub;
          $("rNote").textContent = r.note;
          $("rBars").innerHTML = r.bars
            .map(
              (b) =>
                `<div class="trait"><span>${b.label}</span><i><b data-w="${b.pct}"></b></i></div>`,
            )
            .join("");
          revealEl.classList.add("show");
          if (!(await wait(1.6))) return;
          revealEl.classList.add("flipped");
          if (!(await wait(1.2))) return;
          revealEl.querySelectorAll("b[data-w]").forEach((b) => {
            b.style.width = b.dataset.w + "%";
          });
        }
        $("rAgain").addEventListener("click", () => {
          location.hash = "";
          location.reload();
        });

        examChEl.addEventListener("click", (e) => {
          const b = e.target.closest(".choice");
          if (b) chooseExam(b.dataset.e);
        });
        againEl.addEventListener("click", () => {
          location.hash = "";
          location.reload();
        });

        /* ---------- input ---------- */
        function choose(k) {
          if (state !== "ask") return;
          ({ now: sceneNow, later: sceneLater, skip: sceneSkip })[k]();
        }
        choicesEl.addEventListener("click", (e) => {
          const b = e.target.closest(".choice");
          if (b) choose(b.dataset.k);
        });
        addEventListener("keydown", (e) => {
          if (state === "gate-ask") {
            const m = { 1: "climb", 2: "tell", 3: "back" }[e.key];
            if (m) chooseGate(m);
            return;
          }
          if (state === "exam-ask") {
            const m = { 1: "own", 2: "peek", 3: "blank" }[e.key];
            if (m) chooseExam(m);
            return;
          }
          if (state === "wallet-ask") {
            const m = { 1: "give", 2: "take", 3: "ignore" }[e.key];
            if (m) chooseWallet(m);
            return;
          }
          if (e.key === "1") choose("now");
          else if (e.key === "2") choose("later");
          else if (e.key === "3") choose("skip");
        });

        /* ---------- loop utama ---------- */
        let last = performance.now();
        function frame(now) {
          const dt = Math.min(0.1, (now - last) / 1000);
          last = now;
          clock.sec += dt * clock.f;
          if (state === "gate-ask") {
            const t = now / 1000;
            place(kid, 930, 880 + Math.sin(t * 7) * 1.8, 1.2, "L");
            idlePose(kid, t * 7);
            idlePose(guard, t * 2);
          } else if (state === "wallet-ask") {
            const t = now / 1000;
            place(kid, KX, KY + Math.sin(t * 7) * 1.8, KS, "R");
            idlePose(kid, t * 7);
          }
          renderClock();
          renderCam(now / 1000);
          requestAnimationFrame(frame);
        }
        renderParallax();
        requestAnimationFrame(frame);

        /* ---------- pembuka ---------- */
        if (location.hash === "#kelas") enterClass();
        else if (location.hash === "#ulangan") toExam();
        else if (location.hash === "#dompet") toCorridor("own");
        else if (location.hash === "#guru") {
          award("gate", "tell");
          award("kelas", "now");
          award("ulangan", "own");
          award("dompet", "give");
          toBell();
        } else gateStart();
      })();
    </script>
  </body>
</html>
